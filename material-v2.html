<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Material</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#0c0b0f;--bg2:#15141a;--bg3:#1e1d25;--border:#2a2933;--fg:#e8e4df;--fg2:#9a958d;--fg3:#5a5650;--accent:#c9a227}
html,body{height:100%;background:var(--bg);color:var(--fg);font-family:'DM Mono',monospace;overflow:hidden}
.app{height:100vh;height:100dvh;display:flex;flex-direction:column}
.hdr{padding:14px 20px;display:flex;align-items:baseline;gap:12px;border-bottom:1px solid var(--border);flex-shrink:0}
.logo{font-family:'Instrument Serif',serif;font-size:24px;color:var(--accent);letter-spacing:1px}
.logo sub{font-size:10px;color:var(--fg3);font-weight:300;margin-left:4px;font-family:'DM Mono',monospace}

/* Mode tabs */
.modes{display:flex;border-bottom:1px solid var(--border);flex-shrink:0}
.mode-tab{flex:1;text-align:center;padding:12px;font-size:11px;font-weight:500;letter-spacing:1.5px;text-transform:uppercase;color:var(--fg3);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s}
.mode-tab.active{color:var(--accent);border-bottom-color:var(--accent)}

/* Panels */
.panel{display:none;flex:1;flex-direction:column;overflow:hidden}.panel.active{display:flex}
.panel-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:20px}

/* Ask mode */
.ask-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:16px}
.ask-input{width:100%;max-width:500px;background:var(--bg2);border:2px solid var(--border);border-radius:14px;padding:18px 20px;font-family:'DM Mono',monospace;font-size:16px;color:var(--fg);outline:none;transition:border-color .15s}
.ask-input:focus{border-color:var(--accent)}
.ask-input::placeholder{color:var(--fg3)}
.ask-hint{font-size:11px;color:var(--fg3);text-align:center;line-height:1.8;max-width:400px}
.ask-examples{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:500px}
.ask-ex{padding:6px 12px;background:var(--bg2);border:1px solid var(--border);border-radius:20px;font-size:10px;color:var(--fg2);cursor:pointer;transition:all .15s}
.ask-ex:active{background:var(--accent);color:var(--bg);border-color:var(--accent)}

/* Do mode */
.do-grid{display:flex;flex-direction:column;gap:8px}
.do-card{padding:16px;background:var(--bg2);border:1.5px solid var(--border);border-radius:12px;cursor:pointer;transition:all .15s}
.do-card:active{transform:scale(0.98)}
.do-card.selected{border-color:var(--accent)}
.do-title{font-size:13px;font-weight:500;margin-bottom:3px}.do-desc{font-size:10px;color:var(--fg3)}
.do-options{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.do-label{font-size:10px;color:var(--fg3);letter-spacing:1px;text-transform:uppercase;margin-bottom:4px}
.do-input{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-family:'DM Mono',monospace;font-size:12px;color:var(--fg);outline:none}
.do-row{display:flex;gap:8px;align-items:center}
.do-chips{display:flex;flex-wrap:wrap;gap:6px}
.do-chip{padding:6px 12px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;font-size:11px;color:var(--fg2);cursor:pointer}.do-chip.sel{border-color:var(--accent);color:var(--accent)}

/* Shared */
.btn{padding:14px 20px;border-radius:10px;font-family:'DM Mono',monospace;font-size:12px;cursor:pointer;text-align:center;border:none;font-weight:500;width:100%;margin-top:16px}
.btn-primary{background:var(--accent);color:var(--bg)}
.btn-secondary{background:var(--bg3);color:var(--fg2);border:1px solid var(--border)}
.section-title{font-family:'Instrument Serif',serif;font-size:22px;margin-bottom:4px}
.section-desc{font-size:12px;color:var(--fg2);margin-bottom:20px}

/* Result */
.result-wrap{display:none;flex:1;flex-direction:column;overflow:hidden}.result-wrap.show{display:flex}
.result-bar{padding:12px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;flex-shrink:0;flex-wrap:wrap}
.result-bar .rn{font-family:'Instrument Serif',serif;font-size:16px;color:var(--accent)}
.result-bar .rs{font-size:10px;color:var(--fg3);margin-left:8px}
.result-preview{flex:1;overflow:hidden;background:#111}.result-preview iframe{width:100%;height:100%;border:none}
</style>
</head>
<body>
<div class="app">
<div class="hdr"><div class="logo">Material<sub>v2</sub></div><div style="margin-left:auto"><button class="hdr-btn" onclick="toggleKey()" id="keyBtn" style="font-size:10px">&#9881;</button></div></div>
<div id="keyBar" style="display:none;padding:8px 20px;background:var(--bg2);border-bottom:1px solid var(--border);display:none;gap:8px;align-items:center">
  <span style="font-size:10px;color:var(--fg3);white-space:nowrap">API Key:</span>
  <input type="password" id="apiKey" placeholder="sk-ant-... (optional, for standalone use)" style="flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-family:'DM Mono',monospace;font-size:10px;color:var(--fg);outline:none;min-width:0">
  <button class="hdr-btn" onclick="saveKey()" style="font-size:10px;padding:4px 10px">Save</button>
</div>
<div class="modes">
  <div class="mode-tab active" onclick="switchMode('ask')">Ask</div>
  <div class="mode-tab" onclick="switchMode('do')">Do</div>
  <div class="mode-tab" onclick="switchMode('make')">Make</div>
</div>

<!-- ASK MODE -->
<div class="panel active" id="p-ask">
  <div class="ask-wrap">
    <div class="section-title">What do you need?</div>
    <input class="ask-input" id="askInput" placeholder="resize images to 800px wide..." autofocus>
    <div class="ask-examples" id="askExamples"></div>
    <div class="ask-hint">Describe the tool in one line. Material builds it.</div>
  </div>
</div>

<!-- DO MODE -->
<div class="panel" id="p-do">
  <div class="panel-scroll">
    <div class="section-title">Build a tool</div>
    <div class="section-desc">Pick a task, set options, generate.</div>
    <div class="do-grid" id="doGrid"></div>
    <div id="doOptions" style="margin-top:16px"></div>
  </div>
</div>

<!-- MAKE MODE -->
<div class="panel" id="p-make">
  <div class="panel-scroll">
    <div class="section-title">Build a language</div>
    <div class="section-desc">Visual programming environment.</div>
    <div id="makeSteps"></div>
  </div>
</div>

<!-- RESULT -->
<div class="result-wrap" id="resultWrap">
  <div class="result-bar">
    <span class="rn" id="rName"></span>
    <span class="rs" id="rStats"></span>
    <div style="margin-left:auto;display:flex;gap:8px">
      <button class="btn-secondary" style="width:auto;padding:8px 14px;font-size:11px;margin:0" onclick="backToMain()">&#8592; Back</button>
      <button class="btn-secondary" style="width:auto;padding:8px 14px;font-size:11px;margin:0" onclick="printResult()">&#128424; Print</button>
      <button class="btn-primary" style="width:auto;padding:8px 14px;font-size:11px;margin:0" onclick="downloadResult()">&#8595; Download</button>
    </div>
  </div>
  <div class="result-preview"><iframe id="previewFrame"></iframe></div>
</div>
</div>

<script>
var genHTML='',genName='tool';

// ═══ MODE SWITCHING ═══
function switchMode(m){
  document.querySelectorAll('.mode-tab').forEach(function(t,i){t.classList.toggle('active',['ask','do','make'][i]===m)});
  document.querySelectorAll('.panel').forEach(function(p){p.classList.remove('active')});
  document.getElementById('p-'+m).classList.add('active');
  document.getElementById('resultWrap').classList.remove('show');
}
function backToMain(){document.getElementById('resultWrap').classList.remove('show');document.querySelectorAll('.panel').forEach(function(p){if(p.id!=='resultWrap')p.style.display=''});}
function showResult(name,html){
  genHTML=html;genName=name;
  document.querySelectorAll('.panel').forEach(function(p){p.classList.remove('active')});
  document.getElementById('resultWrap').classList.add('show');
  document.getElementById('rName').textContent=name;
  document.getElementById('rStats').textContent=(html.length/1024).toFixed(1)+'KB';
  document.getElementById('previewFrame').srcdoc=html;
}
function downloadResult(){var b=new Blob([genHTML],{type:'text/html'});var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=genName.toLowerCase().replace(/\s+/g,'-')+'.html';a.click();}
function printResult(){var f=document.getElementById('previewFrame');if(f&&f.contentWindow)f.contentWindow.print();}

// API Key management
function toggleKey(){var kb=document.getElementById('keyBar');kb.style.display=kb.style.display==='flex'?'none':'flex';}
function saveKey(){var k=document.getElementById('apiKey').value.trim();try{if(k)localStorage.setItem('material_api_key',k);else localStorage.removeItem('material_api_key')}catch(e){}document.getElementById('keyBar').style.display='none';document.getElementById('keyBtn').style.color=k?'var(--accent)':'var(--fg2)';}
function getKey(){try{var k=localStorage.getItem('material_api_key');if(k){document.getElementById('apiKey').value=k;document.getElementById('keyBtn').style.color='var(--accent)'}return k||''}catch(e){return ''}}

// ═══ TRANSFORMS LIBRARY ═══
var SHELL_HEAD='<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><style>*{margin:0;padding:0;box-sizing:border-box}body{min-height:100vh;background:#0f0f1a;color:#e0e0ff;font-family:system-ui;display:flex;flex-direction:column;align-items:center;padding:20px;gap:16px}h2{font-size:16px;font-weight:600;color:#c9a227;margin-top:20px}.drop{width:90%;max-width:500px;min-height:200px;border:3px dashed #2a2a4a;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer;padding:20px;transition:border-color .2s;text-align:center}.drop.over{border-color:#c9a227}.drop p{font-size:13px;color:#666}.drop small{font-size:10px;color:#444}input[type=file]{display:none}input[type=number],input[type=text],select{background:#1a1a2e;border:1px solid #2a2a4a;color:#e0e0ff;padding:10px 14px;border-radius:8px;font-size:13px;font-family:system-ui;outline:none;width:200px}button.go{background:#c9a227;color:#000;border:none;padding:12px 24px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;margin-top:8px}.status{font-size:12px;color:#666;min-height:20px}a.dl{color:#c9a227;text-decoration:underline;font-size:13px}</style></head><body>';
var SHELL_FOOT='</body></html>';

function shellWrap(title,body){
  return SHELL_HEAD+'<h2>'+title+'</h2>'+body+SHELL_FOOT;
}

// Drop zone snippet
var DROP_HTML='<div class="drop" id="dz"><p>Drop files here</p><small>or tap to browse</small></div><input type="file" id="fi" multiple>';
var DROP_JS='var dz=document.getElementById("dz"),fi=document.getElementById("fi");dz.onclick=function(){fi.click()};dz.ondragover=function(e){e.preventDefault();dz.classList.add("over")};dz.ondragleave=function(){dz.classList.remove("over")};dz.ondrop=function(e){e.preventDefault();dz.classList.remove("over");handleFiles(e.dataTransfer.files)};fi.onchange=function(){handleFiles(fi.files)};';

var TASKS=[
  {id:'img_resize',cat:'Image',title:'Resize Images',desc:'Scale images to a specific width or height',
    opts:[{id:'w',label:'Width (px)',type:'number',def:800},{id:'h',label:'Height (0=auto)',type:'number',def:0}],
    gen:function(o){
      return shellWrap('Resize to '+o.w+'px',DROP_HTML+'<div class="status" id="st"></div><scr'+'ipt>'+DROP_JS+
      'function handleFiles(files){var st=document.getElementById("st");for(var i=0;i<files.length;i++){(function(f){var img=new Image();img.onload=function(){var w='+o.w+',h='+o.h+';if(!h)h=Math.round(img.height*(w/img.width));var c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);c.toBlob(function(b){var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="resized-"+f.name;a.click();st.textContent="Done: "+f.name},"image/png")};img.src=URL.createObjectURL(f)})(files[i])}}</scr'+'ipt>');}},

  {id:'img_convert',cat:'Image',title:'Convert Format',desc:'PNG↔JPG↔WEBP conversion',
    opts:[{id:'fmt',label:'Output format',type:'select',choices:['png','jpeg','webp'],def:'jpeg'}],
    gen:function(o){
      return shellWrap('Convert to '+o.fmt.toUpperCase(),DROP_HTML+'<div class="status" id="st"></div><scr'+'ipt>'+DROP_JS+
      'function handleFiles(files){for(var i=0;i<files.length;i++){(function(f){var img=new Image();img.onload=function(){var c=document.createElement("canvas");c.width=img.width;c.height=img.height;c.getContext("2d").drawImage(img,0,0);c.toBlob(function(b){var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=f.name.replace(/\\.[^.]+$/,"."+"'+o.fmt+'");a.click();document.getElementById("st").textContent="Done: "+f.name},"image/'+o.fmt+'",0.92)};img.src=URL.createObjectURL(f)})(files[i])}}</scr'+'ipt>');}},

  {id:'img_grayscale',cat:'Image',title:'Grayscale Images',desc:'Convert images to black and white',
    opts:[],
    gen:function(o){
      return shellWrap('Grayscale',DROP_HTML+'<div class="status" id="st"></div><scr'+'ipt>'+DROP_JS+
      'function handleFiles(files){for(var i=0;i<files.length;i++){(function(f){var img=new Image();img.onload=function(){var c=document.createElement("canvas");c.width=img.width;c.height=img.height;var x=c.getContext("2d");x.drawImage(img,0,0);var d=x.getImageData(0,0,c.width,c.height);for(var j=0;j<d.data.length;j+=4){var g=d.data[j]*0.299+d.data[j+1]*0.587+d.data[j+2]*0.114;d.data[j]=d.data[j+1]=d.data[j+2]=g;}x.putImageData(d,0,0);c.toBlob(function(b){var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="gray-"+f.name;a.click();document.getElementById("st").textContent="Done: "+f.name},"image/png")};img.src=URL.createObjectURL(f)})(files[i])}}</scr'+'ipt>');}},

  {id:'img_watermark',cat:'Image',title:'Watermark Images',desc:'Add text overlay to images',
    opts:[{id:'text',label:'Watermark text',type:'text',def:'DRAFT'},{id:'size',label:'Font size',type:'number',def:48}],
    gen:function(o){
      return shellWrap('Watermark: '+o.text,DROP_HTML+'<div class="status" id="st"></div><scr'+'ipt>'+DROP_JS+
      'function handleFiles(files){for(var i=0;i<files.length;i++){(function(f){var img=new Image();img.onload=function(){var c=document.createElement("canvas");c.width=img.width;c.height=img.height;var x=c.getContext("2d");x.drawImage(img,0,0);x.globalAlpha=0.3;x.fillStyle="#fff";x.font="'+o.size+'px sans-serif";x.textAlign="center";x.fillText("'+o.text+'",c.width/2,c.height/2);c.toBlob(function(b){var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="wm-"+f.name;a.click();document.getElementById("st").textContent="Done: "+f.name},"image/png")};img.src=URL.createObjectURL(f)})(files[i])}}</scr'+'ipt>');}},

  {id:'img_to_pdf',cat:'Convert',title:'Image to PDF',desc:'Convert PNG/JPG to PDF',
    opts:[],
    gen:function(){
      return shellWrap('Image \u2192 PDF',DROP_HTML+'<div class="status" id="st"></div><scr'+'ipt>'+DROP_JS+
      'function handleFiles(files){(function(f){var img=new Image();img.onload=function(){var c=document.createElement("canvas");c.width=img.width;c.height=img.height;c.getContext("2d").drawImage(img,0,0);var j=c.toDataURL("image/jpeg",0.92).split(",")[1];var bytes=atob(j);var w=img.width,h=img.height;var s="q "+w+" 0 0 "+h+" 0 0 cm /I0 Do Q";var p="%PDF-1.4\\n",o=[];o.push(p.length);p+="1 0 obj<</Type/Catalog/Pages 2 0 R>>endobj\\n";o.push(p.length);p+="2 0 obj<</Type/Pages/Kids[3 0 R]/Count 1>>endobj\\n";o.push(p.length);p+="3 0 obj<</Type/Page/Parent 2 0 R/MediaBox[0 0 "+w+" "+h+"]/Contents 4 0 R/Resources<</XObject<</I0 5 0 R>>>>>>endobj\\n";o.push(p.length);p+="4 0 obj<</Length "+s.length+">>stream\\n"+s+"\\nendstream\\nendobj\\n";o.push(p.length);p+="5 0 obj<</Type/XObject/Subtype/Image/Width "+w+"/Height "+h+"/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length "+bytes.length+">>stream\\n";var pre=p,post="\\nendstream\\nendobj\\n";var xo=pre.length+bytes.length+post.length;var xr="xref\\n0 6\\n0000000000 65535 f \\n";for(var i=0;i<5;i++)xr+=(o[i]+"").padStart(10,"0")+" 00000 n \\n";xr+="trailer<</Size 6/Root 1 0 R>>\\nstartxref\\n"+xo+"\\n%%EOF";var ar=new Uint8Array(pre.length+bytes.length+post.length+xr.length);for(var i=0;i<pre.length;i++)ar[i]=pre.charCodeAt(i);for(var i=0;i<bytes.length;i++)ar[pre.length+i]=bytes.charCodeAt(i);var ps=post+xr;for(var i=0;i<ps.length;i++)ar[pre.length+bytes.length+i]=ps.charCodeAt(i);var bl=new Blob([ar],{type:"application/pdf"});var a=document.createElement("a");a.href=URL.createObjectURL(bl);a.download=f.name.replace(/\\.[^.]+$/,"")+".pdf";a.click();document.getElementById("st").textContent="Done!"};img.src=URL.createObjectURL(f)})(files[0])}</scr'+'ipt>');}},

  // ═══ BATCH 11: Math & Finance ═══
  {id:'date_calc',cat:'Productivity',title:'Date Calculator',desc:'Days between dates, add/subtract days',
    opts:[],
    gen:function(){
      return shellWrap('Date Calculator','<div style="max-width:400px;margin:0 auto"><div style="margin-bottom:16px"><div style="font-size:10px;color:#888;margin-bottom:4px">Days Between Dates</div><div style="display:flex;gap:8px"><input type="date" id="d1" style="flex:1;background:#1a1a2e;border:1px solid #2a2a4a;color:#e0e0ff;padding:8px;border-radius:8px" onchange="calc1()"><input type="date" id="d2" style="flex:1;background:#1a1a2e;border:1px solid #2a2a4a;color:#e0e0ff;padding:8px;border-radius:8px" onchange="calc1()"></div><div id="r1" style="text-align:center;font-size:24px;color:#c9a227;padding:12px"></div></div><div><div style="font-size:10px;color:#888;margin-bottom:4px">Add/Subtract Days</div><div style="display:flex;gap:8px;align-items:center"><input type="date" id="d3" style="flex:1;background:#1a1a2e;border:1px solid #2a2a4a;color:#e0e0ff;padding:8px;border-radius:8px" onchange="calc2()"><span style="color:#888">+</span><input type="number" id="dn" value="30" style="width:70px;text-align:center" onchange="calc2()"><span style="color:#888">days</span></div><div id="r2" style="text-align:center;font-size:18px;color:#c9a227;padding:12px"></div></div></div><scr'+'ipt>var now=new Date().toISOString().slice(0,10);document.getElementById("d1").value=now;document.getElementById("d2").value=now;document.getElementById("d3").value=now;function calc1(){var a=new Date(document.getElementById("d1").value),b=new Date(document.getElementById("d2").value);var diff=Math.round((b-a)/(1000*60*60*24));document.getElementById("r1").textContent=Math.abs(diff)+" days"+(diff<0?" (past)":"")}function calc2(){var d=new Date(document.getElementById("d3").value);var n=parseInt(document.getElementById("dn").value)||0;d.setDate(d.getDate()+n);document.getElementById("r2").textContent=d.toDateString()}calc1();calc2()</scr'+'ipt>');}},

  {id:'percentage',cat:'Productivity',title:'Percentage Calculator',desc:'What % of X is Y, X% of Y, % change',
    opts:[],
    gen:function(){
      return shellWrap('Percentage','<div style="max-width:400px;margin:0 auto;display:flex;flex-direction:column;gap:16px"><div style="padding:14px;background:#1a1a2e;border:1px solid #2a2a4a;border-radius:10px"><div style="font-size:10px;color:#888;margin-bottom:8px">What is X% of Y?</div><div style="display:flex;gap:6px;align-items:center"><input type="number" id="a1" value="15" style="width:70px;text-align:center" oninput="c1()"><span style="color:#888">% of</span><input type="number" id="a2" value="200" style="width:70px;text-align:center" oninput="c1()"><span style="color:#888">=</span><span id="r1" style="color:#c9a227;font-weight:700;font-size:18px"></span></div></div><div style="padding:14px;background:#1a1a2e;border:1px solid #2a2a4a;border-radius:10px"><div style="font-size:10px;color:#888;margin-bottom:8px">X is what % of Y?</div><div style="display:flex;gap:6px;align-items:center"><input type="number" id="b1" value="30" style="width:70px;text-align:center" oninput="c2()"><span style="color:#888">is</span><span id="r2" style="color:#c9a227;font-weight:700;font-size:18px"></span><span style="color:#888">of</span><input type="number" id="b2" value="200" style="width:70px;text-align:center" oninput="c2()"></div></div><div style="padding:14px;background:#1a1a2e;border:1px solid #2a2a4a;border-radius:10px"><div style="font-size:10px;color:#888;margin-bottom:8px">% Change</div><div style="display:flex;gap:6px;align-items:center"><input type="number" id="c1v" value="80" style="width:70px;text-align:center" oninput="c3()"><span style="color:#888">\u2192</span><input type="number" id="c2v" value="100" style="width:70px;text-align:center" oninput="c3()"><span style="color:#888">=</span><span id="r3" style="color:#c9a227;font-weight:700;font-size:18px"></span></div></div></div><scr'+'ipt>function c1(){document.getElementById("r1").textContent=(parseFloat(document.getElementById("a1").value)*parseFloat(document.getElementById("a2").value)/100).toFixed(2)}function c2(){document.getElementById("r2").textContent=(parseFloat(document.getElementById("b1").value)/parseFloat(document.getElementById("b2").value)*100).toFixed(1)+"%"}function c3(){var a=parseFloat(document.getElementById("c1v").value),b=parseFloat(document.getElementById("c2v").value);var ch=((b-a)/Math.abs(a)*100).toFixed(1);document.getElementById("r3").textContent=(ch>0?"+":"")+ch+"%"}c1();c2();c3()</scr'+'ipt>');}},

  {id:'tip_calc',cat:'Productivity',title:'Tip Calculator',desc:'Split bills with tip',
    opts:[],

function askGo(){
  var q=document.getElementById('askInput').value.trim();
  if(!q)return;
  for(var i=0;i<PATTERNS.length;i++){
    var m=q.match(PATTERNS[i].re);
    if(m){
      var opts=PATTERNS[i].extract(m);
      var taskId=opts._task||PATTERNS[i].task;
      var task=TASKS.find(function(t){return t.id===taskId});
      if(task){
        var html=task.gen(opts);
        showResult(task.title,html);
        return;
      }
    }
  }
  // No built-in match — ask Claude to build it
  askAI(q);
}

async function askAI(query){
  // Show loading state
  showResult('Building...', shellWrap('Building your tool...','<p style="color:#c9a227;text-align:center;padding:40px;font-size:14px">Generating code for:<br><br><b style="color:#fff">"'+query.replace(/</g,'&lt;')+'"</b><br><br><span style="color:#666">This takes a few seconds...</span></p>'));

  var prompt='You are a tool generator. The user needs a single-purpose HTML tool.\n\n'
    +'User request: "'+query+'"\n\n'
    +'Generate a COMPLETE, standalone HTML page that does exactly what they asked.\n'
    +'Requirements:\n'
    +'- Single HTML file with inline CSS and JS\n'
    +'- Dark theme: background #0f0f1a, text #e0e0ff, accent #c9a227\n'
    +'- Clean, minimal UI — only what is needed\n'
    +'- Use drag-and-drop file input if the task involves files\n'
    +'- Mobile-friendly\n'
    +'- No external dependencies\n'
    +'- No comments in code, keep it compact\n\n'
    +'Return ONLY the HTML. No markdown, no explanation, no backticks. Just the raw HTML starting with <!DOCTYPE html>';

  try{
    var headers={"Content-Type": "application/json","anthropic-version":"2023-06-01"};
    var key=getKey();
    if(key){headers["x-api-key"]=key;headers["anthropic-dangerous-direct-browser-access"]="true";}
    var response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: headers,
      body: JSON.stringify({
        model: "claude-sonnet-4-20250514",
        max_tokens: 4000,
        messages: [{role: "user", content: prompt}]
      })
    });

    var data = await response.json();
    var html = '';

    // Extract text from response
    if(data.content){
      for(var i=0;i<data.content.length;i++){
        if(data.content[i].type==='text') html+=data.content[i].text;
      }
    }

    // Clean up — strip markdown fences if present
    html=html.replace(/^```html?\n?/,'').replace(/\n?```$/,'').trim();

    if(html.indexOf('<!DOCTYPE')>=0 || html.indexOf('<html')>=0 || html.indexOf('<head')>=0){
      // Extract a title for the result bar
      var titleMatch=html.match(/<title>([^<]*)<\/title>/);
      var title=titleMatch?titleMatch[1]:query.slice(0,30);
      showResult(title,html);
    }else{
      // Response wasn't HTML — wrap it
      showResult(query.slice(0,30),shellWrap('Result','<pre style="color:#e0e0ff;white-space:pre-wrap;padding:20px;font-size:12px">'+html.replace(/</g,'&lt;')+'</pre>'));
    }
  }catch(err){
    // API not available (running outside Claude.ai) — show fallback
    showResult('AI not available',shellWrap('AI not available','<p style="color:#888;text-align:center;padding:40px">AI generation requires either:<br><br><b style="color:#c9a227">1.</b> Running inside Claude.ai (free)<br><b style="color:#c9a227">2.</b> Adding your API key via \u2699 button<br><br>Built-in tools (Do tab) always work offline.<br><br><span style="color:#c9a227">'+ASK_EXAMPLES.slice(0,10).join(' \u00b7 ')+'</span></p>'));
  }
}

var doSel=null;
function renderDo(){
  var cats={};TASKS.forEach(function(t){if(!cats[t.cat])cats[t.cat]=[];cats[t.cat].push(t)});
  var html='';
  for(var cat in cats){
    html+='<div style="font-size:9px;color:var(--fg3);letter-spacing:1.5px;text-transform:uppercase;margin:12px 0 6px">'+cat+'</div>';
    cats[cat].forEach(function(t){
      html+='<div class="do-card '+(doSel===t.id?'selected':'')+'" onclick="selectTask(\''+t.id+'\')"><div class="do-title">'+t.title+'</div><div class="do-desc">'+t.desc+'</div></div>';
    });
  }
  document.getElementById('doGrid').innerHTML=html;
  renderDoOpts();
}
function selectTask(id){doSel=id;renderDo();}
function renderDoOpts(){
  var el=document.getElementById('doOptions');
  if(!doSel){el.innerHTML='';return;}
  var task=TASKS.find(function(t){return t.id===doSel});
  if(!task){el.innerHTML='';return;}
  var html='<div class="section-title" style="font-size:16px">'+task.title+'</div>';
  if(task.opts&&task.opts.length){
    html+='<div class="do-options">';
    task.opts.forEach(function(o){
      html+='<div><div class="do-label">'+o.label+'</div>';
      if(o.type==='select'){
        html+='<div class="do-chips">';
        o.choices.forEach(function(c){html+='<div class="do-chip" data-opt="'+o.id+'" data-val="'+c+'" onclick="this.parentNode.querySelectorAll(\'.do-chip\').forEach(function(x){x.classList.remove(\'sel\')});this.classList.add(\'sel\')">'+c+'</div>';});
        html+='</div>';
      }else{
        html+='<input class="do-input" type="'+(o.type||'text')+'" data-opt="'+o.id+'" value="'+(o.def||'')+'">';
      }
      html+='</div>';
    });
    html+='</div>';
  }
  html+='<button class="btn btn-primary" onclick="doGenerate()">&#9889; Generate Tool</button>';
  el.innerHTML=html;
  // Select defaults for chips
  el.querySelectorAll('.do-chips').forEach(function(g){var first=g.querySelector('.do-chip');if(first)first.classList.add('sel')});
}
function doGenerate(){
  var task=TASKS.find(function(t){return t.id===doSel});
  if(!task)return;
  var opts={};
  document.querySelectorAll('#doOptions [data-opt]').forEach(function(el){
    if(el.classList.contains('do-chip')){if(el.classList.contains('sel'))opts[el.dataset.opt]=el.dataset.val;}
    else opts[el.dataset.opt]=el.type==='number'?parseInt(el.value)||0:el.value;
  });
  // Fill defaults
  if(task.opts)task.opts.forEach(function(o){if(opts[o.id]===undefined)opts[o.id]=o.def});
  var html=task.gen(opts);
  showResult(task.title,html);
}
renderDo();

  html+='</div>';
  html+='<button class="btn btn-primary" onclick="makeGenerate()">&#9889; Generate Language</button>';
  document.getElementById('makeSteps').innerHTML=html;
}
function makeGenerate(){
  // Reuse the simplified language generator from Material v1
  var CAT_TYPES={structure:[{id:'queen',name:'Entry',color:'#c9a227',icon:'\u265b',isEntry:1,def:'main'},{id:'worker',name:'Group',color:'#b47832',icon:'\u2b21',def:'MyGroup'},{id:'call',name:'Call',color:'#dca03c',icon:'\u2197',def:'MyGroup'}],data:[{id:'var',name:'Variable',color:'#1a8fd6',def:'x = 0'},{id:'array',name:'Array',color:'#1a6fb0',icon:'[]',def:'arr = [1,2,3]'},{id:'math',name:'Math',color:'#2db5a0',icon:'\u03a3',def:'x + 1'}],flow:[{id:'cond',name:'If',color:'#d4384a',icon:'?',def:'x > 0'},{id:'loop_start',name:'Loop',color:'#d48a15',icon:'\u21bb',def:'3',isWall:1},{id:'loop_end',name:'End',color:'#b07212',icon:'\u21ba',def:'',isWall:1},{id:'while',name:'While',color:'#c47a10',icon:'\u27f3',def:'x < 10'}],output:[{id:'print',name:'Print',color:'#22b06a',icon:'\u25b8',def:'"Hello"'},{id:'comment',name:'Comment',color:'#7a7e8a',icon:'#',def:'note',isInert:1}],draw:[{id:'canvas',name:'Canvas',color:'#e06020',icon:'\ud83c\udfa8',def:'400 300'},{id:'draw',name:'Draw',color:'#e08030',icon:'\u270f',def:'circle 200 150 50'},{id:'style',name:'Style',color:'#d07028',icon:'\ud83d\udd8c',def:'fill #ff6600'}],sound:[{id:'synth',name:'Synth',color:'#d44090',icon:'\u266a',def:'sine'},{id:'note',name:'Note',color:'#e050a0',icon:'\u266b',def:'C4 8n'}],physics:[{id:'world',name:'World',color:'#55a040',icon:'\ud83c\udf0d',def:'400 300 1'},{id:'pbody',name:'Body',color:'#60b050',icon:'\u25cf',def:'circle 200 50 25'}],interactive:[{id:'input',name:'Input',color:'#17a88f',icon:'\u2328',def:'name'},{id:'slider',name:'Slider',color:'#9966dd',icon:'\u25c9',def:'val 0 100 50'}]};
  var types=[];MCFG.cats.forEach(function(c){if(CAT_TYPES[c])types=types.concat(CAT_TYPES[c].map(function(t){return Object.assign({cat:c},t)}))});
  types.push({id:'space',name:'Spacer',color:'#8a8e9a',icon:'',def:'',isInert:1,cat:'layout'});
  var ec=(types.find(function(t){return t.isEntry})||{color:'#c9a227'}).color;
  var tj=JSON.stringify(types);
  // Generate (same as Material v1 buildLang)
  var st={bg:'#ddd8d0',grid:'#b8a898',surface:'#fff',text:'#1a1c20',muted:'#888d9b'};
  var html=`<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no"><title>${MCFG.name}</title><link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Outfit:wght@300;500;700&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}:root{--bg:${st.bg};--surface:${st.surface};--border:${st.grid};--text:${st.text};--muted:${st.muted}}body{background:var(--bg);color:var(--text);font-family:Outfit,sans-serif;height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column;touch-action:none;user-select:none}header{display:flex;align-items:center;padding:8px 12px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;gap:8px}.logo{font-family:Space Mono,monospace;font-size:14px;font-weight:700;color:${ec};letter-spacing:1px}.hb{margin-left:auto;display:flex;gap:6px}.hb button{font-family:Space Mono,monospace;font-size:11px;padding:6px 12px;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:6px;cursor:pointer}.run-btn{background:${ec}!important;color:#fff!important;border:none!important;font-weight:700}.fb{display:flex;align-items:center;background:var(--surface);border-bottom:1px solid var(--border);height:44px;z-index:99}.fb-t{padding:0 12px;font-family:Space Mono,monospace;font-size:12px;font-weight:700;cursor:pointer;height:100%;display:flex;align-items:center;gap:6px;border-right:1px solid var(--border)}.fb-i{flex:1;border:none;background:transparent;padding:0 12px;height:100%;font-family:Space Mono,monospace;font-size:14px;color:var(--text);outline:none}.cw{flex:1;position:relative;overflow:hidden;background:var(--bg)}svg.gs{width:100%;height:100%;position:absolute}.sh{position:absolute;bottom:0;left:0;right:0;background:var(--surface);border-radius:16px 16px 0 0;z-index:200;transform:translateY(100%);transition:transform .3s;max-height:85vh;display:flex;flex-direction:column}.sh.open{transform:translateY(0)}.shh{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border)}.shb{flex:1;overflow-y:auto;padding:12px 18px}.ol{font-family:Space Mono,monospace;font-size:12px;padding:3px 0}.ol.info{color:var(--muted)}.ol.err{color:#d44}.dd{position:absolute;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.15);z-index:300;max-height:60vh;overflow-y:auto;display:none;min-width:180px}.dd.open{display:block}.dc{padding:8px 14px;font-size:9px;font-weight:700;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase}.di{padding:10px 14px;cursor:pointer;display:flex;align-items:center;gap:10px;font-size:12px}.ddt{width:10px;height:10px;border-radius:50%;flex-shrink:0}.zi{position:absolute;bottom:12px;right:12px;font-family:Space Mono,monospace;font-size:10px;color:var(--muted);background:var(--surface);padding:4px 10px;border-radius:6px;border:1px solid var(--border);z-index:50;pointer-events:none}</style></head><body><header><div class="logo">${MCFG.name.toUpperCase()}</div><div class="hb"><button onclick="clearAll()">Clear</button><button class="run-btn" onclick="runProgram()">&#9654; Run</button></div></header><div class="fb"><div class="fb-t" id="fbT" onclick="openDD()"><span id="fbD" style="width:8px;height:8px;border-radius:50%;display:none"></span><span id="fbN">tap a tile</span> &#9662;</div><input class="fb-i" id="fbI" placeholder="tap to edit" autocomplete="off"/></div><div class="cw" id="cw"><svg class="gs" id="svg"><g id="gL"></g><g id="eL"></g><g id="hL"></g></svg><div class="zi" id="zi">100%</div></div><div class="sh" id="oS"><div class="shh"><span>Output</span><button style="background:none;border:none;font-size:20px;cursor:pointer" onclick="closeS('oS')">&times;</button></div><div class="shb" id="oB"></div></div><div class="dd" id="tDD"></div><`+`script>var SZ=30,HW=Math.sqrt(3)*SZ,HH=2*SZ,GR=20;var TYPES=${tj};var TM={};TYPES.forEach(function(t){TM[t.id]=t});var nodes=[],nid=0,sel=null,panX=0,panY=0,zm=1;var gL=document.getElementById('gL'),eL=document.getElementById('eL'),hL=document.getElementById('hL'),fbI=document.getElementById('fbI');function hv(cx,cy,s){var a=[];for(var i=0;i<6;i++){var an=Math.PI/180*(60*i-30);a.push({x:cx+s*Math.cos(an),y:cy+s*Math.sin(an)})}return a}function hp(cx,cy,s){return hv(cx,cy,s).map(function(v){return v.x+','+v.y}).join(' ')}function a2p(q,r){return{x:HW*(q+r*0.5),y:HH*r*0.75}}function p2a(x,y){var r=y/(HH*0.75);return{q:Math.round(x/HW-r*0.5),r:Math.round(r)}}var CW=[{dq:0,dr:-1},{dq:1,dr:-1},{dq:1,dr:0},{dq:0,dr:1},{dq:-1,dr:1},{dq:-1,dr:0}];function dk(c,f){var r=parseInt(c.slice(1,3),16),g=parseInt(c.slice(3,5),16),b=parseInt(c.slice(5,7),16);return'#'+[r,g,b].map(function(v){return Math.round(v*f).toString(16).padStart(2,'0')}).join('')}function lt(c,f){var r=parseInt(c.slice(1,3),16),g=parseInt(c.slice(3,5),16),b=parseInt(c.slice(5,7),16);return'#'+[r,g,b].map(function(v){return Math.min(255,Math.round(v*(1+f))).toString(16).padStart(2,'0')}).join('')}function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}function dGrid(){var sv=document.getElementById('svg'),w=sv.clientWidth,h=sv.clientHeight;sv.setAttribute('viewBox',(panX-w/(2*zm))+' '+(panY-h/(2*zm))+' '+w/zm+' '+h/zm);var s='';for(var q=-GR;q<=GR;q++)for(var r=-GR;r<=GR;r++){if(Math.abs(q+r)>GR)continue;var p=a2p(q,r);s+='<polygon points="'+hp(p.x,p.y,SZ-1)+'" fill="none" stroke="${st.grid}" stroke-width="0.7" opacity="0.5"/>';}gL.innerHTML=s}function dHex(){var s='';for(var i=0;i<nodes.length;i++){var n=nodes[i],p=a2p(n.q,n.r),t=TM[n.type];if(!t)continue;var isE=!!t.isEntry,isSel=sel&&sel.id===n.id,isIn=!!t.isInert;s+='<g data-id="'+n.id+'">';if(isSel){s+='<polygon points="'+hp(p.x,p.y,SZ+3)+'" fill="none" stroke="#fff" stroke-width="2.5" opacity="0.8"/>';s+='<polygon points="'+hp(p.x,p.y,SZ+5)+'" fill="none" stroke="'+t.color+'" stroke-width="1" opacity="0.4"/>';}if(isIn){s+='<polygon points="'+hp(p.x,p.y,SZ-1)+'" fill="#c8ccd4" opacity="0.2" stroke="#b0b4bc" stroke-width="1"/>';}else{s+='<polygon points="'+hp(p.x,p.y,SZ-1)+'" fill="'+lt(t.color,0.15)+'" opacity="'+(isE?.85:.75)+'" stroke="'+lt(t.color,0.3)+'" stroke-width="'+(isE?2.5:2)+'"/>';s+='<polygon points="'+hp(p.x,p.y,SZ-5)+'" fill="'+dk(t.color,0.55)+'" opacity="'+(isE?.95:.9)+'" stroke="none"/>';}if(t.icon&&isE)s+='<text x="'+p.x+'" y="'+(p.y-10)+'" text-anchor="middle" font-size="11" fill="'+t.color+'">'+t.icon+'</text>';else if(t.icon&&!isIn)s+='<text x="'+(p.x+13)+'" y="'+(p.y-9)+'" text-anchor="middle" font-size="7" fill="#fff" opacity="0.5">'+t.icon+'</text>';if(!isIn){var lb=n.label.length>8?n.label.slice(0,7)+'\\u2026':n.label;s+='<text x="'+p.x+'" y="'+(isE?p.y+5:p.y+1)+'" text-anchor="middle" dominant-baseline="middle" fill="#fff" font-family="Space Mono,monospace" font-size="8" font-weight="700">'+esc(lb)+'</text>';}s+='</g>';}hL.innerHTML=s}function dEdge(){var s='';for(var i=0;i<nodes.length;i++){var a=nodes[i],pa=a2p(a.q,a.r),ta=TM[a.type];if(!ta||ta.isInert)continue;for(var j=i+1;j<nodes.length;j++){var b=nodes[j],tb=TM[b.type];if(!tb||tb.isInert)continue;for(var d=0;d<CW.length;d++){if(a.q+CW[d].dq===b.q&&a.r+CW[d].dr===b.r){var pb=a2p(b.q,b.r);s+='<line x1="'+pa.x+'" y1="'+pa.y+'" x2="'+pb.x+'" y2="'+pb.y+'" stroke="'+ta.color+'" stroke-width="3" opacity="0.8" stroke-linecap="round"/>';s+='<line x1="'+pa.x+'" y1="'+pa.y+'" x2="'+pb.x+'" y2="'+pb.y+'" stroke="'+ta.color+'" stroke-width="8" opacity="0.12" stroke-linecap="round"/>';}}}}eL.innerHTML=s}function redraw(){dGrid();dHex();dEdge()}document.getElementById('cw').addEventListener('click',function(e){var sv=document.getElementById('svg'),rc=sv.getBoundingClientRect(),vb=sv.viewBox.baseVal;var sx=(e.clientX-rc.left)/rc.width*vb.width+vb.x,sy=(e.clientY-rc.top)/rc.height*vb.height+vb.y;var ax=p2a(sx,sy),ex=nodes.find(function(n){return n.q===ax.q&&n.r===ax.r});if(ex){sel=ex;upFB();redraw()}else{var n={id:nid++,type:'space',q:ax.q,r:ax.r,label:''};nodes.push(n);sel=n;upFB();openDD();redraw()}});function upFB(){var d=document.getElementById('fbD'),nm=document.getElementById('fbN');if(!sel){d.style.display='none';nm.textContent='tap a tile';fbI.value='';return}var t=TM[sel.type];if(t){d.style.display='inline-block';d.style.background=t.color;nm.textContent=t.name}else{d.style.display='none';nm.textContent='Spacer'}fbI.value=sel.label}fbI.addEventListener('input',function(){if(sel){sel.label=this.value;redraw()}});function openDD(){var dd=document.getElementById('tDD'),s='',lc='';for(var i=0;i<TYPES.length;i++){var t=TYPES[i];if(t.cat!==lc){lc=t.cat;s+='<div class="dc">'+t.cat+'</div>';}s+='<div class="di" onclick="pickT(\\x27'+t.id+'\\x27)"><div class="ddt" style="background:'+t.color+'"></div>'+(t.icon||'')+' '+t.name+'</div>';}dd.innerHTML=s;dd.classList.add('open');dd.style.left='8px';dd.style.top='88px'}function closeDD(){document.getElementById('tDD').classList.remove('open')}function pickT(id){if(!sel)return;sel.type=id;var t=TM[id];if(t&&!sel.label)sel.label=t.def||'';closeDD();upFB();redraw()}document.addEventListener('click',function(e){if(!e.target.closest('.dd')&&!e.target.closest('.fb-t'))closeDD()});function runProgram(){var vars={},lines=[];var entry=nodes.find(function(n){return TM[n.type]&&TM[n.type].isEntry});if(!entry){lines.push({text:'No entry tile.',type:'err'});openO(lines);return}lines.push({text:'\\u265b Running '+entry.label,type:'info'});var visited={},queue=[entry],order=[];visited[entry.id]=1;while(queue.length){var cur=queue.shift();order.push(cur);for(var d=0;d<CW.length;d++){var nb=nodes.find(function(n){return n.q===cur.q+CW[d].dq&&n.r===cur.r+CW[d].dr});if(nb&&!visited[nb.id]){visited[nb.id]=1;if(!TM[nb.type]||!TM[nb.type].isInert)queue.push(nb)}}}function rv(str){var o=str;for(var k in vars){var v=vars[k];o=o.replace(new RegExp('\\\\b'+k+'\\\\b','g'),typeof v==='string'?v:JSON.stringify(v))}return o}for(var i=0;i<order.length;i++){var nd=order[i],tp=nd.type;if(tp==='queen')lines.push({text:'\\u265b '+nd.label,type:'info'});else if(tp==='print'){var v=nd.label.replace(/^["']/,'').replace(/["']$/,'');v=rv(v);lines.push({text:'\\u25b8 '+v,type:''})}else if(tp==='var'||tp==='array'){var m=nd.label.match(/(\\w+)\\s*=\\s*(.+)/);if(m){var val=m[2].trim();val=rv(val);try{val=eval(val)}catch(e){}vars[m[1]]=val;lines.push({text:'  '+m[1]+' = '+JSON.stringify(val),type:'info'})}}else if(tp==='math'){try{var m=nd.label.match(/^(\\w+)\\s*=\\s*(.+)/);if(m){var r=eval(rv(m[2]));vars[m[1]]=r;lines.push({text:'  \\u03a3 '+m[1]+' = '+r,type:'info'})}else{lines.push({text:'  \\u03a3 '+eval(rv(nd.label)),type:'info'})}}catch(e){lines.push({text:'  Math error',type:'err'})}}else if(tp==='comment'){}else if(nd.label)lines.push({text:'  '+nd.label,type:'info'})}if(lines.length<=1)lines.push({text:'No output.',type:'info'});openO(lines)}function openO(lines){document.getElementById('oB').innerHTML=lines.map(function(l){return'<div class="ol '+l.type+'">'+l.text+'</div>'}).join('');document.getElementById('oS').classList.add('open')}function closeS(id){document.getElementById(id).classList.remove('open')}function clearAll(){nodes=[];nid=0;sel=null;closeDD();upFB();redraw();closeS('oS')}document.getElementById('cw').addEventListener('wheel',function(e){e.preventDefault();if(e.ctrlKey||e.metaKey){zm*=e.deltaY>0?0.9:1.1;zm=Math.max(0.3,Math.min(3,zm))}else{panX+=e.deltaX/zm;panY+=e.deltaY/zm}document.getElementById('zi').textContent=Math.round(zm*100)+'%';redraw()},{passive:false});redraw();<`+`/script></body></html>`;
