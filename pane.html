<!DOCTYPE html>
<!--
  Pane — a small browser for pages written in Tiny's UI language. One self-contained file, works offline.
  The engine is pane.js (the source of truth), inlined below between the PANE:BEGIN / PANE:END markers, and
  the built-in pages are pages/*.pane, inlined between PAGES:BEGIN / PAGES:END. After editing either, rebuild
  this file with:   node tools/build-pane-html.js
  Page scripts run in mote.js, inlined between MOTE:BEGIN / MOTE:END by:   node tools/build-mote-html.js
  Edit everything else in this file directly; the build only replaces the marked regions.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a1322">
<title>Pane</title>
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:#060e1a;color:#bbddff;font:14px/1.3 system-ui,sans-serif;overflow:hidden}
#bar{display:flex;gap:6px;align-items:center;padding:6px 8px;padding-top:max(6px,env(safe-area-inset-top));background:#0a1322;border-bottom:1px solid #1a2a44}
#bar button{flex:none;width:36px;height:36px;border:1px solid #1e2f4c;border-radius:6px;background:#101c30;color:#bbddff;font-size:16px;cursor:pointer}
#bar button:disabled{opacity:.35;cursor:default}
#bar button:not(:disabled):hover{background:#17273f}
#go{flex:1;min-width:0;display:flex}
#addr{flex:1;min-width:0;height:36px;padding:0 10px;border:1px solid #1e2f4c;border-radius:6px;background:#060e1a;color:#dde8ff;font:14px ui-monospace,Menlo,Consolas,monospace}
#addr:focus,#bar button:focus-visible{outline:2px solid #4a90d9;outline-offset:1px}
#stage{flex:1;min-height:0;position:relative}
#view{position:absolute;inset:0;width:100%;height:100%;display:block}
#status{flex:none;min-height:22px;padding:3px 10px;padding-bottom:max(3px,env(safe-area-inset-bottom));background:#0a1322;border-top:1px solid #1a2a44;color:#7f95b8;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#perm{flex:none;display:flex;gap:8px;align-items:center;padding:6px 10px;background:#1b2740;border-bottom:1px solid #2c426a;color:#dde8ff;font-size:13px}
#perm[hidden]{display:none}
#permText{flex:1;min-width:0;overflow-wrap:anywhere}
#perm button{flex:none;height:30px;padding:0 12px;border:1px solid #3a5688;border-radius:6px;background:#22365a;color:#dde8ff;font-size:13px;cursor:pointer}
#perm button:focus-visible{outline:2px solid #4a90d9;outline-offset:1px}
/* the text-only copy of the page: off screen, still read by screen readers */
#mirror{position:absolute;left:-10000px;top:0;width:1px;height:1px;overflow:hidden}
</style>
</head>
<body>
<header id="bar">
  <button id="back" type="button" aria-label="Back" title="Back" disabled>&#9664;</button>
  <button id="fwd" type="button" aria-label="Forward" title="Forward" disabled>&#9654;</button>
  <button id="reload" type="button" aria-label="Reload" title="Reload">&#10227;</button>
  <form id="go" autocomplete="off"><input id="addr" type="text" inputmode="url" spellcheck="false" autocapitalize="off" aria-label="Address" placeholder="page name or address"></form>
</header>
<div id="perm" role="alert" hidden><span id="permText"></span><button id="permAllow" type="button">Allow</button><button id="permNo" type="button">Not now</button></div>
<main id="stage">
  <canvas id="view" aria-label="Page"></canvas>
  <div id="mirror"></div>
</main>
<footer id="status" role="status"></footer>

/** A compiled function: bytecode, constants, nested protos, upvalue descriptors, debug info. */

  const page = newPage();
  parseInto(page, page.root, String(src).split(/\r?\n/), false);
  return page;
}

/** Add elements written in the page format to a container of a page that is already there. Returns how many. */
function append(page, container, src) {
  const before = page.nodes;
  parseInto(page, container, String(src).split(/\r?\n/), true);
  return page.nodes - before;
}

/** Remove everything inside a container. */
function clear(page, container) {
  (function drop(n) {
    for (const c of n.children || []) { if (c.name && page.names[c.name] === c) delete page.names[c.name]; page.nodes--; drop(c); }
  })(container);
  container.children = [];
}

function parseInto(page, container, lines, fragment) {
  const stack = [container];
  const cur = () => stack[stack.length - 1];
  const warn = (line, msg) => { if (page.warnings.length < 200) page.warnings.push({ line, msg }); };
  const inherit = () => {
    const p = cur().props;
    return { bg: null, fg: p.fg ? p.fg.slice() : null, fnt: p.fnt, pad: 0, gap: 0, brd: null, size: null, fontFamily: p.fontFamily || null };
  };
  let last = null, script = null, inScript = false;
  const add = (n, lineNo) => {
    if (page.nodes >= LIMITS.nodes) throw new Error('a page can hold ' + LIMITS.nodes + ' elements');
    n.props = inherit(); n.line = lineNo; page.nodes++; cur().children.push(n); last = n; return n;
  };
  const open = (n, lineNo) => { n.children = []; add(n, lineNo); stack.push(n); return n; };

  for (let i = 0; i < lines.length; i++) {
    const t = lines[i].trim(), lineNo = i + 1;
    if (inScript) { if (/^end\s+script$/i.test(t)) inScript = false; else if (script) script[i] = lines[i]; continue; }
    if (!t) continue;
    const parts = t.split(/\s+/), cmd = parts[0].toLowerCase();
    const rest = t.slice(parts[0].length).trim();
    if (cmd === 'rem') continue;
    if (cmd === 'script' && parts.length === 1) {
      if (fragment) { warn(lineNo, 'script cannot be added to a page that is running'); }
      else if (!script) script = new Array(lines.length).fill('');
      inScript = true;
      continue;
    }
    const p = cur().props;
    switch (cmd) {
      // containers
      case 'row': case 'col': case 'tbl': case 'lst': open({ type: cmd }, lineNo); break;
      case 'box': case 'scl': open({ type: cmd }, lineNo).props.size = parseSize(parts[1]); break;
      case 'grid': open({ type: 'grid', cols: Math.max(1, Math.min(50, int(parts[1], 2))) }, lineNo); break;
      case 'dlg': open({ type: 'dlg', title: rest, open: true }, lineNo); break;
      case 'acc': open({ type: 'acc', title: rest, open: false }, lineNo); break;
      case 'tab': open({ type: 'tab', tabs: rest.split(',').map(s => s.trim()).filter(Boolean), sel: 0 }, lineNo); break;
      case 'end': if (stack.length > 1) last = stack.pop(); else warn(lineNo, 'end without an open container'); break;
      // a name for the element written just before (or the container just opened or closed)
      case 'id': {
        const name = (parts[1] || '').toLowerCase();
        if (!NAME.test(name)) warn(lineNo, 'id needs a name made of letters, digits and _');
        else if (!last) warn(lineNo, 'id names the element before it, and there is none');
        else if (page.names[name]) warn(lineNo, 'the name "' + name + '" is already used');
        else { if (last.name) delete page.names[last.name]; last.name = name; page.names[name] = last; }
        break;
      }
      // properties of the current container
      case 'pad': p.pad = Math.max(0, int(parts[1], 0)); break;
      case 'gap': p.gap = Math.max(0, int(parts[1], 0)); break;
      case 'bg': if (parts.length >= 4) { p.bg = rgb3(parts, 1); delete p.bgA; } break;
      case 'bge': if (parts.length >= 5) { p.bg = rgb3(parts, 1); p.bgA = Math.max(0, Math.min(1, parseFloat(parts[4]) / 255 || 0)); } break;
      case 'fg': if (parts.length >= 4) p.fg = rgb3(parts, 1); break;
      case 'brd': if (parts.length >= 4) p.brd = rgb3(parts, 1); break;
      case 'fnt': p.fnt = Math.max(6, Math.min(200, int(parts[1], 14))); break;
      case 'font': {
        const name = rest.split(/\s+/).filter(Boolean).map(w => w[0].toUpperCase() + w.slice(1)).join(' ');
        if (/^[A-Za-z0-9 ]{1,60}$/.test(name)) { p.fontFamily = name; if (!page.fonts.includes(name)) page.fonts.push(name); }
        else warn(lineNo, 'font name not understood');
        break;
      }
      case 'grow': p.grow = Math.max(0, parseFloat(parts[1]) || 0); break;
      case 'w': case 'h': case 'minw': case 'maxw': case 'minh': case 'maxh': {
        const v = parseSize(parts[1]);
        if (v == null) warn(lineNo, cmd + ' needs a number or a percentage'); else p[cmd] = v;
        break;
      }
      case 'align': if (ALIGN.has(parts[1])) p.align = parts[1]; else warn(lineNo, 'align: start, center, end or stretch'); break;
      case 'just': if (JUST.has(parts[1])) p.just = parts[1]; else warn(lineNo, 'just: start, center, end or between'); break;
      case 'title': if (fragment) warn(lineNo, 'title belongs at the top of a page'); else page.title = rest; break;
      // elements
      case 'txt': add({ type: 'txt', text: rest }, lineNo); break;
      case 'btn': {
        const hasId = parts.length > 2 && /^\d+$/.test(parts[parts.length - 1]);
        add({ type: 'btn', label: hasId ? parts.slice(1, -1).join(' ') : rest, id: hasId ? int(parts[parts.length - 1], 0) : 0 }, lineNo);
        break;
      }
      case 'inp': add({ type: 'inp', id: int(parts[1], 0) }, lineNo); break;
      case 'tog': add({ type: 'tog', id: int(parts[1], 0) }, lineNo); break;
      case 'chk': add({ type: 'chk', id: int(parts[1], 0), label: parts.slice(2).join(' ') }, lineNo); break;
      case 'sel': add({ type: 'sel', id: int(parts[1], 0), opts: parts.slice(2).join(' ').split(',').map(s => s.trim()).filter(Boolean) }, lineNo); break;
      case 'sld': {
        const min = parseFloat(parts[1]) || 0; let max = parseFloat(parts[2]); if (isNaN(max)) max = 100; if (max <= min) max = min + 1;
        add({ type: 'sld', min, max, id: int(parts[3], 0) }, lineNo);
        break;
      }
      case 'prg': add({ type: 'prg', val: parts[1] || '0', max: parts[2] || '100' }, lineNo); break;
      case 'img': add({ type: 'img', url: rest }, lineNo); break;
      case 'avt': add({ type: 'avt', url: rest }, lineNo); break;
      case 'lnk': {
        const sp = rest.lastIndexOf(' ');
        add({ type: 'lnk', text: sp > 0 ? rest.slice(0, sp) : rest, url: sp > 0 ? rest.slice(sp + 1) : rest }, lineNo);
        break;
      }
      case 'div': add({ type: 'div' }, lineNo); break;
      case 'spn': add({ type: 'spn' }, lineNo); break;
      case 'tmr': add({ type: 'tmr', id: int(parts[1], 0), ms: Math.max(50, int(parts[2], 1000)) }, lineNo); break;
      case 'bdg': add({ type: 'bdg', text: rest }, lineNo); break;
      case 'rat': add({ type: 'rat', id: int(parts[1], 0), max: Math.max(1, Math.min(20, int(parts[2], 5))) }, lineNo); break;
      case 'ico': add({ type: 'ico', name: parts[1] || '' }, lineNo); break;
      // statements: run at load (set) and on widget events / timer ticks (if)
      case 'if': case 'set': if (fragment) warn(lineNo, 'statements belong to the page, not to added elements'); else page.stmts.push({ text: t, line: lineNo }); break;
      default: warn(lineNo, 'unknown word "' + parts[0] + '"');
    }
  }
  if (inScript) warn(lines.length, 'script without end script');
  if (script && !fragment) page.script = script.join('\n');
}

// ════════════════════════════════════════════ expressions ════════════════════════════════════════════

/** A fresh state: variables and widget values. Keys of vars are lower-case. */
function newState() {
  return { vars: Object.create(null), inputs: Object.create(null), togs: Object.create(null), chks: Object.create(null),
    sels: Object.create(null), slds: Object.create(null), taps: Object.create(null), activeInput: -1 };
}

const TOKEN = /\s*(?:(\d+\.?\d*|\.\d+)|"([^"]*)"|([A-Za-z_][A-Za-z0-9_]*)|(<>|>=|<=|==|!=|[-+*\/()=<>]))/y;
const ACCESSORS = new Set(['val', 'str', 'tap', 'chk', 'tog', 'sel', 'sld', 'rat']);
const num = v => typeof v === 'number' ? v : (v === '' || isNaN(Number(v)) ? 0 : Number(v));
const truthy = v => typeof v === 'string' ? v !== '' : v !== 0;

function tokenize(src) {
  const out = []; TOKEN.lastIndex = 0;
  for (;;) {
    const at = TOKEN.lastIndex, m = TOKEN.exec(src);
    if (!m) { if (src.slice(at).trim()) throw new Error('unexpected ' + src.slice(at).trim()[0]); break; }
    if (m[1] !== undefined) out.push({ k: 'num', v: parseFloat(m[1]) });
    else if (m[2] !== undefined) out.push({ k: 'str', v: m[2] });
    else if (m[3] !== undefined) out.push({ k: 'id', v: m[3].toLowerCase() });
    else out.push({ k: 'op', v: m[4] });
  }
  return out;
}

/**
 * Evaluate an expression against a state. Numbers, "strings", variables (unknown → 0), ( ), unary -,
 * * /, + - (+ joins when either side is a string), = <> < > <= >= (== and != also accepted), not, and, or.
 * Widget values: val N (input as a number, or its text when it is not a number), str N (input text), tap N,
 * chk N, tog N, sel N, sld N, rat N. A malformed expression is 0.

  function primary() {
    const t = toks[i++];
    if (!t) throw new Error('unexpected end');
    if (t.k === 'num' || t.k === 'str') return t.v;
    if (t.k === 'op' && t.v === '(') { const v = or(); if (!isOp(')')) throw new Error('missing )'); i++; return v; }
    if (t.k === 'op' && t.v === '-') return -num(primary());
    if (t.k === 'id') {
      if (ACCESSORS.has(t.v) && peek() && peek().k === 'num') {
        const id = toks[i++].v;
        switch (t.v) {
          case 'val': { const s = st.inputs[id] || ''; return s !== '' && !isNaN(Number(s)) ? Number(s) : s === '' ? 0 : s; }
          case 'str': return st.inputs[id] || '';
          case 'tap': return st.taps[id] ? 1 : 0;
          case 'chk': return st.chks[id] ? 1 : 0;
          case 'tog': return st.togs[id] ? 1 : 0;
          case 'sel': return st.sels[id] || 0;
          case 'sld': return st.slds[id] || 0;
          case 'rat': return st.vars['rat' + id] || 0;
        }
      }
      return t.v in st.vars ? st.vars[t.v] : 0;
    }
    throw new Error('unexpected ' + t.v);
  }

    let l = primary();
    while (isOp('*') || isOp('/')) { const op = toks[i++].v, r = num(primary()); l = op === '*' ? num(l) * r : (r ? num(l) / r : 0); }

  }

  }
  function cmp() {
    const l = addp(), t = peek();
    if (!t || t.k !== 'op' || !/^(<>|>=|<=|==|!=|=|<|>)$/.test(t.v)) return l;
    i++;

    const a = strs ? String(l) : l, b = strs ? String(r) : r;

      case '>': return a > b ? 1 : 0;
      case '<=': return a <= b ? 1 : 0;

  function not() { if (isId('not')) { i++; return truthy(not()) ? 0 : 1; } return cmp(); }
  function and() { let l = not(); while (isId('and')) { i++; const r = not(); l = truthy(l) && truthy(r) ? 1 : 0; } return l; }
  function or() { let l = and(); while (isId('or')) { i++; const r = and(); l = truthy(l) || truthy(r) ? 1 : 0; } return l; }
  try { const v = or(); if (i < toks.length) throw new Error('unexpected ' + toks[i].v); return v; } catch (e) { return 0; }
}

/** How a value is shown in text: integers as they are, other numbers with at most 6 decimals. */
function fmt(v) {
  if (typeof v !== 'number') return String(v);
  if (!isFinite(v)) return '0';
  return Number.isInteger(v) ? String(v) : String(parseFloat(v.toFixed(6)));
}

/** The text an element shows: a text that is exactly a variable's name shows the variable; {expr} is replaced. */
function display(text, st) {
  if (!text) return '';
  const key = text.toLowerCase();
  if (key in st.vars) return fmt(st.vars[key]);
  return text.indexOf('{') < 0 ? text : text.replace(/\{([^{}]*)\}/g, (_, e) => fmt(evalExpr(e, st)));
}

const textOf = n => (n.type === 'btn' || n.type === 'chk' ? n.label : n.type === 'acc' || n.type === 'dlg' ? n.title : n.text) || '';
/** What an element shows. Text a script put there is shown as it is: no variable, no {expr}. */
const shownText = (n, st) => n.raw ? textOf(n) : display(textOf(n), st);

/** One action of a statement. host: { navigate(url), sound(url), web(url, name) }, each optional. */
function execAction(a, st, host) {
  a = a.trim();
  const sp = a.search(/\s/), word = (sp < 0 ? a : a.slice(0, sp)).toLowerCase(), rest = sp < 0 ? '' : a.slice(sp).trim();
  if (word === 'set') {
    const m = /^([A-Za-z_][A-Za-z0-9_]*)\s*=?\s*(.*)$/.exec(rest);
    if (m) st.vars[m[1].toLowerCase()] = evalExpr(m[2], st);
  } else if (word === 'go') { if (host && host.navigate) host.navigate(rest); }
  else if (word === 'snd') { if (host && host.sound) host.sound(rest); }
  else if (word === 'web') { const p = rest.split(/\s+/); if (host && host.web && p[0]) host.web(p[0], (p[1] || 'data').toLowerCase()); }
}

/** Run the page's statements. phase 'load' runs the top-level set lines; phase 'event' runs the if lines. */
function runStatements(page, st, phase, host) {
  for (const s of page.stmts) {
    const t = s.text, low = t.toLowerCase();
    if (low.startsWith('set ')) { if (phase === 'load') execAction(t, st, host); continue; }
    if (phase !== 'event') continue;
    let at = low.indexOf(' do '), len = 4;
    if (at < 0) { at = low.indexOf(' then '); len = 6; }
    if (at < 0) continue;
    if (!truthy(evalExpr(t.slice(3, at), st))) continue;
    // ":" separates actions; "://" inside a URL does not
    for (const a of t.slice(at + len).split(/:(?!\/\/)/)) execAction(a, st, host);
  }
}

// ════════════════════════════════════════════ layout ════════════════════════════════════════════

const fam = n => n.props.fontFamily || null;
const px = n => n.props.fnt || 14;
const flow = n => n.children.filter(c => c.type !== 'dlg' && c.type !== 'tmr' && !c.off);
function clamp(v, lo, hi) { if (hi != null && v > hi) v = hi; if (lo != null && v < lo) v = lo; return v; }
/** A size property against the space it is a percentage of; null when unset or not resolvable. */
function resolve(v, of) { return v == null ? null : typeof v === 'number' ? v : of == null ? null : of * v.pct / 100; }

/**
 * Lay the page out for a viewport. env.measure(text, px, family, bold) → width in px (required);
 * env.image(url) → {w, h} or null; env.state → the state texts are read from.
 * Sets x, y, w, h on every node in page coordinates (scrolling is applied when painting), the wrapped lines
 * of every text, page.contentH and page.maxScroll.
 */
function layout(page, vw, vh, env) {
  const st = env.state || newState();
  const cache = env.cache || (env.cache = new Map());
  const widthOf = (text, size, family, bold) => {
    const key = size + '|' + (family || '') + '|' + (bold ? 1 : 0) + '|' + text;
    let w = cache.get(key);
    if (w === undefined) { w = env.measure(text, size, family, !!bold); if (cache.size > 20000) cache.clear(); cache.set(key, w); }
    return w;
  };
  const tw = (n, text, bold) => widthOf(text, px(n), fam(n), bold);

  /** Break text into lines no wider than maxW. A word wider than the line is broken between characters. */
  function wrap(n, text, maxW) {
    const lines = []; let line = '';
    for (const word of text.split(' ')) {
      const test = line ? line + ' ' + word : word;
      if (tw(n, test) <= maxW || !line && tw(n, word) <= maxW) { line = test; continue; }
      if (line) { lines.push(line); line = ''; }
      if (tw(n, word) <= maxW) { line = word; continue; }
      let part = '';
      for (const ch of word) {
        if (part && tw(n, part + ch) > maxW) { lines.push(part); part = ch; } else part += ch;
      }
      line = part;
    }
    if (line || !lines.length) lines.push(line);
    return lines;
  }
  const longestWord = (n, text) => text.split(' ').reduce((m, w) => Math.max(m, tw(n, w)), 0);
  const shown = n => shownText(n, st);
  const cellsOf = n => shown(n).split('|').map(s => s.trim());
  const imgSize = n => (env.image && env.image(n.url)) || null;

  // ── intrinsic widths: [min-content, max-content] ──
  function widths(n) {
    if (n._wd) return n._wd;
    const f = px(n), k = n.children ? flow(n) : null, p = n.props;
    let mn, mx;
    switch (n.type) {
      case 'txt': case 'lnk': { const t = shown(n); mx = tw(n, t) + 4; mn = Math.min(mx, Math.max(longestWord(n, t), f) + 4); break; }
      case 'btn': mn = mx = tw(n, shown(n)) + 24; break;
      case 'inp': mn = 80; mx = 200; break;
      case 'tog': mn = mx = 44; break;
      case 'prg': mn = 40; mx = 120; break;
      case 'img': { const s = imgSize(n); mn = Math.min(64, s ? s.w : 64); mx = s ? s.w : 64; break; }
      case 'sel': mn = mx = n.opts.reduce((m, o) => Math.max(m, tw(n, o)), 0) + 40; break;
      case 'chk': mn = mx = 22 + tw(n, shown(n)) + 6; break;
      case 'sld': mn = 60; mx = 120; break;
      case 'div': mn = mx = 10; break;
      case 'spn': mn = mx = 24; break;
      case 'avt': mn = mx = 40; break;
      case 'bdg': mn = mx = tw(n, shown(n)) + 16; break;
      case 'rat': mn = mx = n.max * 20; break;
      case 'ico': mn = mx = f + 4; break;
      case 'tmr': mn = mx = 0; break;
      case 'row': {
        mn = mx = Math.max(0, k.length - 1) * p.gap;
        for (const c of k) { const fx = resolve(mainFixed(c, true), null), w = widths(c); mn += fx != null ? fx : w[0]; mx += fx != null ? fx : w[1]; }
        break;
      }
      case 'grid': {
        const gap = p.gap || 4; let a = 0, b = 0;
        for (const c of k) { const w = widths(c); a = Math.max(a, w[0]); b = Math.max(b, w[1]); }
        mn = a * n.cols + gap * (n.cols - 1); mx = b * n.cols + gap * (n.cols - 1);
        break;
      }
      case 'tbl': {
        mn = mx = 0;
        for (const r of k) { const cells = cellsOf(r); mx = Math.max(mx, cells.length * (Math.max(...cells.map(c => tw(n, c, true))) + 12)); mn = Math.max(mn, cells.length * 40); }
        break;
      }

        mn = mx = 0;
        for (const c of n.type === 'tab' ? k.slice(n.sel, n.sel + 1) : k) {
          const fx = resolve(c.props.w, null), w = widths(c);
          mn = Math.max(mn, fx != null ? fx : w[0]); mx = Math.max(mx, fx != null ? fx : w[1]);
        }
        if (n.type === 'lst') { mn += LIST_NUM_W; mx += LIST_NUM_W; }
        if (n.type === 'scl') { mn += SCROLLBAR_W; mx += SCROLLBAR_W; }
        if (n.type === 'acc') { const h = tw(n, shown(n), true) + 30; mn = Math.max(mn, h); mx = Math.max(mx, h); }
        if (n.type === 'tab') { const h = n.tabs.reduce((s, t) => s + tw(n, t) + 24, 0); mn = Math.max(mn, h); mx = Math.max(mx, h); }
      }
    }

    const lo = resolve(p.minw, null), hi = resolve(p.maxw, null);

  }
  /** The fixed size a child asks for along its parent's main axis (number, {pct} or null). */
  function mainFixed(c, inRow) {
    const own = inRow ? c.props.w : c.props.h;
    return own != null ? own : (c.type === 'box' || c.type === 'scl') ? c.props.size : null;
  }

  /**
   * Widths of a row's children inside innerW: fixed sizes first, then the rest share by grow, never below
   * min-content. grow defaults to 1 (equal shares); in a row with `just` it defaults to 0 (natural widths),
   * because only spare width can be justified.
   */
  function rowWidths(n, k, innerW) {
    const gap = n.props.gap, out = new Array(k.length), flex = [];
    let avail = innerW - Math.max(0, k.length - 1) * gap;
    k.forEach((c, i) => {
      const w = widths(c), lo = Math.max(w[0], resolve(c.props.minw, innerW) || 0), hi = resolve(c.props.maxw, innerW);
      const fx = resolve(mainFixed(c, true), innerW), grow = c.props.grow != null ? c.props.grow : n.props.just ? 0 : 1;
      if (fx != null) { out[i] = clamp(fx, resolve(c.props.minw, innerW), hi); avail -= out[i]; }
      else if (grow === 0) { out[i] = clamp(w[1], lo, hi); avail -= out[i]; }
      else flex.push({ i, grow, lo, hi });
    });
    // freeze children whose share would break their min or max, then share what is left again
    for (let live = flex.slice(); live.length;) {

  txt A layout engine has to know how tall a paragraph is before it can place whatever comes after it. The height depends on how many lines the paragraph needs, and that depends on the width it is given. So the order is always the same: decide the width, break the text into lines, count the lines, and only then move on.
  txt Tiny broke text into lines while painting. By then every box already had its place, so a paragraph that needed three lines still had the height of one and ran over the element below it. Pane breaks the lines during layout, which is why this paragraph pushes the next one down however narrow the window gets.
  fnt 18

  lst

  end

  fnt 14
  fg 190 205 230
  txt This page has a script. Notes are kept on this device, for this site only.

    gap 8
    inp 1
    id field
    box 90
      btn Add
      id add
    end
  end

  lst
    id list
    gap 4
  end

    just start
    btn Clear all
    id clear
  end

script
local notes = {}

local function show()
  page.clear("list")
  for i, words in ipairs(notes) do
    page.add("list", "txt", words)      -- the words go in as text, whatever they contain
  end
  page.set("count", #notes)
end

local function save()
  store.set("count", #notes)
  for i, words in ipairs(notes) do store.set("note" .. i, words) end
end

for i = 1, store.get("count") or 0 do
  notes[#notes + 1] = store.get("note" .. i)
end

page.on("add", "click", function()
  local field = page.find("field")
  if field.value ~= "" then
    notes[#notes + 1] = field.value
    field.value = ""
    save()
    show()
  end
end)

page.on("clear", "click", function()
  for i = 1, #notes do store.remove("note" .. i) end
  notes = {}
  save()
  show()
end)

show()
end script

<script>
(function () {
'use strict';
const $ = id => document.getElementById(id);
const HOME = 'pane:home', MAX_BYTES = 2e6, TIMEOUT_MS = 15000;
const builtin = Object.create(null);
for (const s of document.querySelectorAll('script[data-page]')) builtin[s.dataset.page] = s.textContent;

let hist = [], at = -1, seq = 0, current = null;

// ── addresses ──
const hasScheme = s => /^[a-z][a-z0-9+.-]*:/i.test(s);
/** What the user typed → an address. A bare word is a built-in page; something with a dot is a site. */
function fromTyped(text) {
  const t = text.trim();
  if (!t) return current ? current.url : HOME;
  if (hasScheme(t)) return t;
  if (!/[./]/.test(t)) return 'pane:' + t.toLowerCase();
  if (/^[^/]+\.[^/]+/.test(t) && !t.startsWith('.')) return 'https://' + t;
  return new URL(t, location.href).href;
}
/** A link or resource on a page → an absolute address, or null when it cannot be one. */
function resolve(ref, base) {
  ref = String(ref).trim();
  if (!ref) return null;
  try {
    if (hasScheme(ref)) return /^pane:/i.test(ref) ? 'pane:' + ref.slice(5).toLowerCase() : new URL(ref).href;
    if (base.startsWith('pane:')) return /[./]/.test(ref) ? new URL(ref, location.href).href : 'pane:' + ref.toLowerCase();
    return new URL(ref, base).href;
  } catch (e) { return null; }
}
/** Only these are ever fetched or shown; anything else (javascript:, file:, blob: …) is refused. */
const allowed = url => /^(pane|https?|data):/i.test(url);

// ── pages the shell writes itself ──
const plain = s => String(s).replace(/[\r\n{}]+/g, ' ').slice(0, 300);
function errorPage(heading, reason, url) {
  return ['title ' + plain(heading), 'align center', 'col', '  w 100%', '  maxw 560', '  pad 24', '  gap 12', '  fnt 22', '  fg 235 240 255',
    '  txt ' + plain(heading), '  fnt 14', '  fg 190 205 230', '  txt ' + plain(reason), '  fg 120 140 170', '  txt ' + plain(url),
    '  lnk Go to the start page pane:home', 'end'].join('\n');
}

/** Fetch an address. Always resolves: { src, url, status, error }. */
async function fetchPage(url) {
  if (!allowed(url)) return { url, status: 0, error: true, src: errorPage('This address cannot be opened', 'Pane opens pane:, http: and https: addresses.', url) };
  if (/^pane:/i.test(url)) {
    const name = url.slice(5);
    if (name in builtin) return { url, status: 200, src: builtin[name] };
    return { url, status: 404, error: true, src: errorPage('No such built-in page', 'There is no page called "' + name + '".', url) };
  }
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), TIMEOUT_MS);
  try {
    const r = await fetch(url, { signal: ctl.signal, credentials: 'omit', redirect: 'follow', cache: 'no-cache' });
    const text = await r.text(), final = r.url || url, type = r.headers.get('content-type') || '';
    if (!r.ok) return { url: final, status: r.status, error: true, src: errorPage('The page did not load', 'The server answered ' + r.status + (r.statusText ? ' ' + r.statusText : '') + '.', final) };
    if (text.length > MAX_BYTES) return { url: final, status: r.status, error: true, src: errorPage('The page is too large', 'Pages can be up to 2 MB.', final) };
    if (/html|xml/i.test(type) || /^\s*</.test(text)) return { url: final, status: r.status, error: true, src: errorPage('This is not a Pane page', 'It looks like an HTML page. Pane reads pages written in its own text format.', final) };
    return { url: final, status: r.status, src: text };
  } catch (e) {
    const why = e && e.name === 'AbortError' ? 'The server took too long to answer.' : 'The address could not be reached, or the server does not allow other sites to read it.';
    return { url, status: 0, error: true, src: errorPage('The page did not load', why, url) };
  } finally { clearTimeout(timer); }
}

// ── who a page is, and what it may reach ──
/** The site of an address: its origin; all built-in pages are one site. Storage and permissions go by site. */
function siteOf(url) {
  if (/^pane:/i.test(url)) return 'pane:';
  try { const u = new URL(url); return /^https?:$/.test(u.protocol) ? u.origin : null; } catch (e) { return null; }
}
const grants = new Map();          // site → Set of other origins the user allowed, until the window closes
let wanted = [], declined = new Set();
/**
 * May a page of `site` request `url`? Its own site: yes. data: for pictures: yes (nothing is fetched).
 * Another site: only after the user said so in the bar under the address bar; until then the request is
 * not made and the bar asks.
 */
function allow(kind, url, site) {
  if (/^data:/i.test(url)) return kind === 'img';
  let origin;
  try { const u = new URL(url); if (!/^https?:$/.test(u.protocol)) return false; origin = u.origin; } catch (e) { return false; }
  if (site && site === origin) return true;
  if (site === 'pane:' && origin === location.origin) return true;
  if (!site) return false;
  if (grants.has(site) && grants.get(site).has(origin)) return true;
  if (!declined.has(origin) && !wanted.includes(origin)) { wanted.push(origin); showAsk(); }
  return false;
}
function showAsk() {
  const bar = $('perm');
  if (!wanted.length || !current) { bar.hidden = true; return; }
  const who = current.site === 'pane:' ? 'This built-in page' : current.site;
  $('permText').textContent = who + ' wants to load from ' + wanted[0] + '.';
  bar.hidden = false;
}
$('permAllow').addEventListener('click', () => {
  if (!wanted.length || !current || !current.site) return;
  if (!grants.has(current.site)) grants.set(current.site, new Set());
  grants.get(current.site).add(wanted.shift());
  navigate(current.url, 'replace');                // load again, now that it may
});
$('permNo').addEventListener('click', () => { if (wanted.length) declined.add(wanted.shift()); showAsk(); });

/**
 * What `store` reads and writes for a site: its own keys only, up to 100 KB in all. Kept in localStorage
 * under a prefix that carries the site; when the browser has no localStorage, kept until the window closes.
 */
const QUOTA = 100000, memory = new Map();
function storageFor(site) {
  if (!site) return null;
  const prefix = 'pane.store|' + site + '|';
  let ls = null;
  try { ls = window.localStorage; ls.getItem(prefix); } catch (e) { ls = null; }
  const mem = ls ? null : (memory.get(site) || memory.set(site, new Map()).get(site));
  const names = () => { if (mem) return [...mem.keys()]; const out = []; for (let i = 0; i < ls.length; i++) { const k = ls.key(i); if (k.startsWith(prefix)) out.push(k.slice(prefix.length)); } return out; };
  const raw = k => mem ? (mem.has(k) ? mem.get(k) : null) : ls.getItem(prefix + k);
  return {
    get: k => { const r = raw(k); if (r == null) return undefined; try { return JSON.parse(r); } catch (e) { return undefined; } },
    set: (k, v) => {
      const r = JSON.stringify(v);
      let used = k.length + r.length;
      for (const other of names()) if (other !== k) used += other.length + raw(other).length;
      if (used > QUOTA) throw new Error('storage is full');
      try { if (mem) mem.set(k, r); else ls.setItem(prefix + k, r); } catch (e) { throw new Error('storage is full'); }
    },
    remove: k => { if (mem) mem.delete(k); else ls.removeItem(prefix + k); },
    keys: () => names().sort(),
  };
}

// ── what pages say ──
const logLines = [];
let note = '', base = '';
const showStatus = () => { $('status').textContent = base + (note ? ' · ' + note : ''); };
function onLog(kind, text) {
  logLines.push({ kind, text }); if (logLines.length > 200) logLines.shift();
  note = (kind === 'error' ? 'script error: ' : kind === 'blocked' ? 'blocked: ' : 'page says: ') + text;
  showStatus();
}

// ── the view ──
const view = Pane.createView($('view'), {
  mirror: $('mirror'), allow, storage: storageFor, onLog,
  resolve: ref => { const u = resolve(ref, current ? current.url : HOME); return u && /^(https?|data):/i.test(u) ? u : null; },
  onNavigate: ref => { const u = resolve(ref, current ? current.url : HOME); if (u) navigate(u, 'push'); },
  onTitle: t => { document.title = t ? t + ' — Pane' : 'Pane'; },
});

function chrome() {
  $('back').disabled = at <= 0;
  $('fwd').disabled = at >= hist.length - 1;
  if (document.activeElement !== $('addr')) $('addr').value = current ? current.url : '';
}
function keepPlace() { if (at >= 0 && view.page) hist[at].scrollY = view.page.scrollY; }

/** Open an address. how: 'push' (a new history entry), 'replace' (reload), or a history index to move to. */
async function navigate(url, how) {
  const mine = ++seq;
  keepPlace();
  base = 'Loading ' + url + ' …'; note = ''; showStatus();
  const res = await fetchPage(url);
  if (mine !== seq) return;                        // a newer navigation started meanwhile
  if (how === 'push') { hist = hist.slice(0, at + 1); hist.push({ url: res.url, scrollY: 0 }); at = hist.length - 1; }
  else if (how === 'replace') { if (at < 0) { hist = [{ url: res.url, scrollY: 0 }]; at = 0; } else hist[at].url = res.url; }
  else at = how;
  current = { url: res.url, status: res.status, site: res.error ? null : siteOf(res.url) };
  wanted = []; declined = new Set(); note = ''; logLines.length = 0; showAsk();
  const page = view.load(res.src, { site: current.site });
  if (typeof how === 'number' && hist[at].scrollY) { page.scrollY = Math.min(hist[at].scrollY, page.maxScroll); view.relayout(); }
  const notes = page.warnings.length ? ' · ' + page.warnings.length + (page.warnings.length === 1 ? ' line' : ' lines') + ' not understood (first: line ' + page.warnings[0].line + ')' : '';
  base = (res.error ? 'Could not open ' : '') + res.url + (res.status && !/^pane:/.test(res.url) ? ' · ' + res.status : '') + notes;
  showStatus();
  try { history.replaceState(null, '', '#' + res.url); } catch (e) {}
  $('addr').blur();
  chrome();
}

$('go').addEventListener('submit', e => { e.preventDefault(); let u; try { u = fromTyped($('addr').value); } catch (err) { u = $('addr').value; } navigate(u, 'push'); });
$('back').addEventListener('click', () => { if (at > 0) navigate(hist[at - 1].url, at - 1); });
$('fwd').addEventListener('click', () => { if (at < hist.length - 1) navigate(hist[at + 1].url, at + 1); });
$('reload').addEventListener('click', () => navigate(current ? current.url : HOME, 'replace'));
$('addr').addEventListener('focus', () => $('addr').select());
window.addEventListener('hashchange', () => { const u = decodeURI(location.hash.slice(1)); if (u && (!current || u !== current.url)) navigate(u, 'push'); });

window.paneShell = { view, navigate, resolve, fromTyped, siteOf, allow, storageFor, grants, log: logLines, get history() { return { entries: hist.map(h => h.url), at }; }, get current() { return current; } };
let first = HOME;
try { if (location.hash.length > 1) first = decodeURI(location.hash.slice(1)); } catch (e) {}
navigate(first, 'push');
})();
</script>
