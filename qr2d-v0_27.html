/* ════════════════════════════════════════════════════════════════
   1. TOKENIZER
   ════════════════════════════════════════════════════════════════ */
function tokenize(line){
  const t=[]; let i=0, s=line;
  while(i<s.length){
    const c=s[i];
    if(c===' '||c==='\t'){i++;continue;}
    if(c==='#'){break;}                                   // comment
    if(c==='"'){                                          // string
      let j=i+1,str='';
      while(j<s.length&&s[j]!=='"'){str+=s[j++];}
      t.push({k:'str',v:str}); i=j+1; continue;
    }
    if(c===':'){t.push({k:'sep'}); i++; continue;}        // clause separator
    if(c===','){t.push({k:'comma'}); i++; continue;}       // argument separator
    if(c==='>'||c==='<'||c==='='){                        // comparison (>, <, =, >=, <=)
      let op=c; if(s[i+1]==='='){op+='=';i++;} t.push({k:'op',v:op}); i++; continue;
    }
    if('+-*/%()'.includes(c)){t.push({k:'op',v:c}); i++; continue;}
    if(/[0-9.]/.test(c)){
      let j=i,n='';
      while(j<s.length&&/[0-9.]/.test(s[j])){n+=s[j++];}
      t.push({k:'num',v:parseFloat(n)}); i=j; continue;
    }
    if(/[a-zA-Z_]/.test(c)){
      let j=i,w='';
      while(j<s.length&&/[a-zA-Z0-9_]/.test(s[j])){w+=s[j++];}
      t.push({k:'word',v:w}); i=j; continue;
    }
    i++; // skip unknown
  }
  return t;
}

/* ════════════════════════════════════════════════════════════════
   2. EXPRESSION PARSER  (infix, precedence, reads t/key/mx/my/i + fns)
   builds a tiny AST we can eval per-frame
   ════════════════════════════════════════════════════════════════ */
function parseExpr(toks,pos){
  // pos is {i}. returns AST node.
  function peek(){return toks[pos.i];}
  function eat(){return toks[pos.i++];}
  function prim(){
    const tk=peek();
    if(!tk) throw 'unexpected end of expression';
    if(tk.k==='op'&&tk.v==='('){eat();const e=compare();const n=peek();if(n&&n.k==='op'&&n.v===')')eat();return e;}   // (a > b) is 1 or 0: usable in arithmetic
    if(tk.k==='op'&&tk.v==='-'){eat();return {t:'neg',a:prim()};}
    if(tk.k==='num'){eat();return {t:'num',v:tk.v};}
    if(tk.k==='word'){
      eat();
      const fns=['sin','cos','abs','sqrt','floor','rnd'];
      if(fns.includes(tk.v)){
        const n=peek();
        if(n&&n.k==='op'&&n.v==='('){eat();const arg=addsub();const c=peek();if(c&&c.k==='op'&&c.v===')')eat();return {t:'call',f:tk.v,a:arg};}
        return {t:'call',f:tk.v,a:prim()};
      }
      return {t:'var',v:tk.v};  // t,key,mx,my,i
    }
    throw 'bad token in expression: '+(tk.v??tk.k);
  }
  function muldiv(){let a=prim();while(peek()&&peek().k==='op'&&'*/%'.includes(peek().v)){const o=eat().v;a={t:'bin',o,a,b:prim()};}return a;}
  function addsub(){let a=muldiv();while(peek()&&peek().k==='op'&&'+-'.includes(peek().v)){const o=eat().v;a={t:'bin',o,a,b:muldiv()};}return a;}
  function compare(){let a=addsub();while(peek()&&peek().k==='op'&&['>','<','=','>=','<='].includes(peek().v)){const o=eat().v;a={t:'cmp',o,a,b:addsub()};}return a;}
  return compare();
}
function evalExpr(node,env){
  switch(node.t){
    case 'num':return node.v;
    case 'neg':return -evalExpr(node.a,env);
    case 'var':return env[node.v]??0;
    case 'bin':{const a=evalExpr(node.a,env),b=evalExpr(node.b,env);
      return node.o==='+'?a+b:node.o==='-'?a-b:node.o==='*'?a*b:node.o==='/'?(b===0?0:a/b):a%b;}
    case 'call':{const a=evalExpr(node.a,env);
      switch(node.f){case 'sin':return Math.sin(a);case 'cos':return Math.cos(a);
        case 'abs':return Math.abs(a);case 'sqrt':return Math.sqrt(Math.max(0,a));
        case 'floor':return Math.floor(a);case 'rnd':return Math.random()*a;}}
    case 'cmp':{const a=evalExpr(node.a,env),b=evalExpr(node.b,env);
      switch(node.o){case '>':return a>b?1:0;case '<':return a<b?1:0;
        case '=':return a===b?1:0;case '>=':return a>=b?1:0;case '<=':return a<=b?1:0;}}
  }
  return 0;
}

/* ════════════════════════════════════════════════════════════════
   3. COMPILER  source → program {init:[stmt], frame:[stmt], events:[]}
   Each stmt is a small object the runtime executes.
   ════════════════════════════════════════════════════════════════ */
const SPAWN={box:4,circ:3,tri:4,oval:4,line:4,dot:2,txt:2};   // oval x, y, w, h = ellipse in that box   // verb -> #numeric args (txt also string)
const XFORM={mv:2,to:2,vel:2,rot:1,scl:1,size:1,shape:2,flip:1,follow:0,grow:0,attach:2,chase:1};  /* size = absolute w&h; shape = absolute w, h */
const APPEAR={col:3,fill:0,unfill:0,fixed:0};  /* fixed = immovable (infinite mass) */

function compile(src){
  const prog={init:[],frame:[],err:null,hits:new Set(),scenes:{},src};  // hits: "a|b" group pairs with an on-hit event
  prog.scenes[1]=prog.init;  // init: == scene 1:   extra rooms:  scene 2:  scene 3: ...
  prog.common=[];            // common: runs after every scene's own statements (hero, hud, walls...)
  prog.defs={};              // def NAME: reusable thing (root shape + attached parts); place with `new NAME x, y`
  const lines=src.split('\n');
  let block=null;           // array the current statements go into
  let blockName=null;
  try{
    for(let ln=0;ln<lines.length;ln++){
      const raw=lines[ln];
      const toks=tokenize(raw);
      if(toks.length===0) continue;

      // block header?  init:   frame:
      if(toks.length===2&&toks[0].k==='word'&&toks[1].k==='sep'){
        const w=toks[0].v;
        if(w==='init'||w==='frame'||w==='common'){block=prog[w];blockName=w;continue;}
      }
      // def NAME:   (a reusable thing: first line is its root shape, following lines its parts)
      if(toks.length===3&&toks[0].k==='word'&&toks[0].v==='def'&&toks[1].k==='word'&&toks[2].k==='sep'){
        const n=toks[1].v; prog.defs[n]=[]; block=prog.defs[n]; blockName='def:'+n; continue;
      }
      // scene N:   (another init block; `scene N` in logic jumps to it, keeping variables)
      if(toks.length===3&&toks[0].k==='word'&&toks[0].v==='scene'&&toks[1].k==='num'&&toks[2].k==='sep'){
        const n=toks[1].v; prog.scenes[n]=prog.scenes[n]||[]; block=prog.scenes[n]; blockName='scene'; continue;
      }
      if(!block) throw `line ${ln+1}: statement outside init:/frame:`;

      const stmt=parseStatement(toks,ln+1);
      if(stmt&&blockName.startsWith('def:')&&stmt.t==='make'&&stmt.spawn&&!stmt.name) stmt.name=blockName.slice(4);  // root takes the def's name
      if(stmt){ block.push(stmt); if(stmt.t==='on_hit'){ prog.hits.add(stmt.a+'|'+stmt.b); prog.hits.add(stmt.b+'|'+stmt.a); } }
    }
  }catch(e){prog.err=''+e;}
  return prog;
}

/* a "statement" is a colon-separated chain of clauses on one line.
   first clause may be:  name: <spawn...>   |   <spawn...>   |   name <xform/appear>
   | on hit a b: <logic chain>   | destroy name   | name <xform>
   subsequent clauses apply to the subject established by the first.
   trailing  lp N  repeats the whole statement N times with var i=0..N-1  */
function parseStatement(toks,ln){
  // detect trailing  lp N
  let loop=1;
  for(let i=0;i<toks.length-1;i++){
    if(toks[i].k==='word'&&toks[i].v==='lp'){
      // lp and the rest must be a count expression -> compile it
      const pos={i:i+1};
      const expr=parseExpr(toks,pos);
      loop=expr;
      toks=toks.slice(0,i);   // strip lp... from the clause tokens
      break;
    }
  }

  // events:  on hit A B : <logic>   |   on key DIR : <logic>
  if(toks[0].k==='word'&&toks[0].v==='on'){
    const kind=toks[1]?.v;
    let si=toks.findIndex(t=>t.k==='sep');
    const logicToks = si>=0? toks.slice(si+1):[];
    const logic=parseClauseChain(logicToks,ln,true);
    if(kind==='hit'){
      const a=toks[2]?.v, b=toks[3]?.v;
      if(!a||!b) throw `line ${ln}: on hit needs two names`;
      return {t:'on_hit',a,b,logic};
    }
    if(kind==='key'){
      const dir=toks[2]?.v;  // up/down/left/right
      if(!['up','down','left','right','hit'].includes(dir)) throw `line ${ln}: on key needs up/down/left/right/hit`;   // hit = space, Z, X, or a tap in the middle of the screen
      return {t:'on_key',dir,logic};
    }
    throw `line ${ln}: unknown event 'on ${kind||''}'`;
  }

  // destroy NAME
  if(toks[0].k==='word'&&toks[0].v==='destroy'){
    return {t:'destroy',name:toks[1]?.v,loop};
  }

  // set VAR EXPR   (declare/assign a global variable)
  if(toks[0].k==='word'&&toks[0].v==='set'){
    const vname=toks[1]?.v;
    if(!vname) throw `line ${ln}: set needs a variable name`;
    const pos={i:2}; const expr=toks.length>2?parseExpr(toks,pos):{t:'num',v:0};
    return {t:'set',name:vname,expr};
  }
  // add VAR EXPR   (increment: add EXPR to VAR)
  if(toks[0].k==='word'&&toks[0].v==='add'){
    const vname=toks[1]?.v;
    if(!vname) throw `line ${ln}: add needs a variable name`;
    const pos={i:2}; const expr=toks.length>2?parseExpr(toks,pos):{t:'num',v:1};
    return {t:'add',name:vname,expr};
  }
  // reset   (restart the whole program from init)
  if(toks[0].k==='word'&&toks[0].v==='reset'){
    return {t:'reset'};
  }
  // start N   (in init: begin in room N — a loaded map puts the hero where the hero was)
  if(toks[0].k==='word'&&toks[0].v==='start'&&toks[1]&&toks[1].k==='num'){ return {t:'start',n:toks[1].v}; }
  // map NAME : actions   (the program's own QR code becomes terrain: dark modules -> fixed boxes named NAME)
  if(toks[0].k==='word'&&toks[0].v==='map'){
    const name=toks[1]&&toks[1].k==='word'?toks[1].v:'wall';
    const si=toks.findIndex(t=>t.k==='sep');
    const str=toks.slice(0, si<0?toks.length:si).find(t=>t.k==='str');   // optional seed text
    return {t:'map',name,seed:str?str.v:null,actions:si>=0?parseActions(toks.slice(si+1),ln):[]};
  }
  // new NAME x, y : actions   (place a def'd thing; actions apply to its root)
  if(toks[0].k==='word'&&toks[0].v==='new'){
    if(!toks[1]||toks[1].k!=='word') throw `line ${ln}: new needs a name`;
    const si=toks.findIndex(t=>t.k==='sep');
    const exprs=splitExprs(toks.slice(2, si<0?toks.length:si),ln);
    const actions=si>=0?parseActions(toks.slice(si+1),ln):[];
    return {t:'new',name:toks[1].v,exprs,actions};
  }
  // if COND : logic   (global condition on variables / t / key / mx / my)
  if(toks[0].k==='word'&&toks[0].v==='if'){
    const si=toks.findIndex(t=>t.k==='sep');
    const condToks=toks.slice(1, si<0?toks.length:si);
    if(!condToks.length) throw `line ${ln}: if needs a condition`;
    const cond=parseExpr(condToks,{i:0});
    const logic=parseClauseChain(si>=0?toks.slice(si+1):[],ln,false);
    return {t:'if',cond,logic};
  }

  // NAME when CONDITION : logic   (per-object conditional)
  // runs the logic on each object in NAME whose condition is true this frame
  {
    const wi=toks.findIndex(t=>t.k==='word'&&t.v==='when');
    if(wi>0 && toks[0].k==='word' && !isVerb(toks[0].v)){
      const name=toks[0].v;
      const si=toks.findIndex(t=>t.k==='sep');
      const condToks = toks.slice(wi+1, si<0?toks.length:si);
      const pos={i:0}; const cond=parseExpr(condToks,pos);
      const logicToks = si>=0? toks.slice(si+1):[];
      const logic=parseClauseChain(logicToks,ln,true);
      return {t:'when',name,cond,logic};
    }
  }

  // NAME each : logic   (run logic on EVERY object in NAME this frame, with its props)
  {
    const ei=toks.findIndex(t=>t.k==='word'&&t.v==='each');
    if(ei>0 && toks[0].k==='word' && !isVerb(toks[0].v)){
      const name=toks[0].v;
      const si=toks.findIndex(t=>t.k==='sep');
      const logicToks = si>=0? toks.slice(si+1):[];
      const logic=parseClauseChain(logicToks,ln,true);
      return {t:'when',name,cond:{t:'num',v:1},logic};  // each = when always-true
    }
  }

  // split into clauses by sep
  const clauses=[]; let cur=[];
  for(const tk of toks){ if(tk.k==='sep'){clauses.push(cur);cur=[];} else cur.push(tk); }
  clauses.push(cur);

  // first clause: binding or spawn or ref+action
  let name=null, spawn=null, actions=[];
  let first=clauses[0];
  // name:  (binding)  -> detected because original had a sep right after word,
  // but we've split on sep; so binding shows as first clause == [word] and
  // the spawn verb sits in clause[1]. Handle both "name:" and inline.
  let ci=0;
  if(first.length===1 && first[0].k==='word' && !isVerb(first[0].v)){
    // could be  name:  (binding, spawn follows)  OR  a bare ref with actions in later clauses
    // decide: if next clause starts with a spawn verb -> binding; else it's a ref
    const nxt=clauses[1]||[];
    if(nxt[0] && SPAWN[nxt[0].v]!==undefined){ name=first[0].v; ci=1; first=clauses[1]; }
  }

  // now `first` should begin with a verb (spawn/xform/appear) or a ref word
  if(first[0] && SPAWN[first[0].v]!==undefined){
    spawn=parseSpawn(first,ln);
  } else if(first[0] && first[0].k==='word' && !isVerb(first[0].v)){
    // reference:  NAME <action...>
    name=name||first[0].v;
    const act=parseActions(first.slice(1),ln);
    actions.push(...act);
  } else {
    // first clause is an action with implicit "last" subject
    actions.push(...parseActions(first,ln));
  }

  // remaining clauses are actions on the subject
  for(let k=ci+1;k<clauses.length;k++){
    actions.push(...parseActions(clauses[k],ln));
  }

  return {t:'make',name,spawn,actions,loop};
}

function isVerb(w){return SPAWN[w]!==undefined||XFORM[w]!==undefined||APPEAR[w]!==undefined;}

function parseSpawn(cl,ln){
  const verb=cl[0].v;
  const node={verb,args:[],str:null,livevar:null};
  if(verb==='txt'){
    // txt x, y, "label"[, varname]  -> x,y are exprs; string is the label;
    // an optional trailing bare word is a live variable shown after the label.
    const nums=cl.slice(1).filter(t=>t.k==='num'||t.k==='op'||t.k==='comma');
    node.exprs=splitExprs(cl.slice(1).filter(t=>t.k!=='str'&&!(t.k==='word')),ln);
    const str=cl.find(t=>t.k==='str'); if(str) node.str=str.v;
    // last word token (that isn't the verb) = live variable
    const words=cl.slice(1).filter(t=>t.k==='word');
    if(words.length) node.livevar=words[words.length-1].v;
    return node;
  }
  const argToks=cl.slice(1).filter(t=>t.k!=='str');
  node.exprs=splitExprs(argToks,ln);
  const str=cl.find(t=>t.k==='str'); if(str) node.str=str.v;
  return node;
}

function parseActions(cl,ln){
  if(cl.length===0) return [];
  const out=[];
  let i=0;
  while(i<cl.length){
    const w=cl[i];
    if(w.k!=='word'){i++;continue;}
    const v=w.v;
    if(v==='flip'){ // flip  |  flip x  |  flip y
      let axis=2; // both
      if(cl[i+1]&&cl[i+1].k==='word'&&(cl[i+1].v==='x'||cl[i+1].v==='y')){
        axis=cl[i+1].v==='x'?0:1; i++;
      }
      out.push({verb:'flip',axis}); i++;
    }
    else if(v==='follow'){ // follow <leader> [gap]
      const leader=cl[i+1]&&cl[i+1].k==='word'?cl[i+1].v:null; i+=2;
      let gap=null;
      if(cl[i]&&cl[i].k==='num'){gap=cl[i].v;i++;}
      out.push({verb:'follow',leader,gap}); // gap null -> default
    }
    else if(v==='chase'){ // chase TARGET speed  -> head toward the newest TARGET at speed px/frame
      const target=cl[i+1]&&cl[i+1].k==='word'?cl[i+1].v:null; let j=i+2;
      const argToks=[]; while(j<cl.length && !(cl[j].k==='word'&&isVerb(cl[j].v))){argToks.push(cl[j]);j++;}
      out.push({verb:'chase',target,exprs:splitExprs(argToks,ln)}); i=j;
    }
    else if(v==='attach'){ // attach PARENT dx, dy  -> this object rides on PARENT at that offset
      const parent=cl[i+1]&&cl[i+1].k==='word'?cl[i+1].v:null; let j=i+2;
      const argToks=[]; while(j<cl.length && !(cl[j].k==='word'&&isVerb(cl[j].v))){argToks.push(cl[j]);j++;}
      out.push({verb:'attach',parent,exprs:splitExprs(argToks,ln)}); i=j;
    }
    else if(v==='grow'){ // grow  |  grow <name>
      let gname=null;
      if(cl[i+1]&&cl[i+1].k==='word'&&!isVerb(cl[i+1].v)){gname=cl[i+1].v;i++;}
      out.push({verb:'grow',gname}); i++;
    }
    else if(XFORM[v]!==undefined||APPEAR[v]!==undefined){
      const n=(XFORM[v]!==undefined?XFORM[v]:APPEAR[v]);
      const argToks=[]; let j=i+1;
      // take all following tokens until next known verb; splitExprs handles commas
      while(j<cl.length && !(cl[j].k==='word'&&isVerb(cl[j].v))){argToks.push(cl[j]);j++;}
      const exprs=splitExprs(argToks,ln);
      out.push({verb:v,exprs:exprs.slice(0,n)});
      i=j;
    } else i++;
  }
  return out;
}

/* split a flat token list into arguments on comma boundaries.
   Each comma-delimited segment is parsed as one infix expression,
   so negatives and math inside an arg are unambiguous:
   vel 2, -3   -> [2, -3]      box 20+i*48, 40  -> [20+i*48, 40]  */
function splitExprs(toks,ln){
  const exprs=[];
  let seg=[];
  const flush=()=>{ if(seg.length){const pos={i:0};exprs.push(parseExpr(seg,pos));seg=[];} };
  for(const tk of toks){
    if(tk.k==='comma'){flush();} else seg.push(tk);
  }
  flush();
  return exprs;
}

/* logic chain used inside events: a sequence of ref-actions / destroy / flip */
function parseClauseChain(toks,ln,subjectKnown){
  // supports:  destroy NAME  |  NAME flip  |  flip  |  col r g b  ... chained by sep
  const clauses=[];let cur=[];
  for(const tk of toks){if(tk.k==='sep'){clauses.push(cur);cur=[];}else cur.push(tk);}
  clauses.push(cur);
  const ops=[];
  for(const cl of clauses){
    if(cl.length===0)continue;
    if(cl[0].v==='destroy'){ops.push({t:'destroy',name:cl[1]?.v});continue;}
    if(cl[0].v==='new'&&cl[1]&&cl[1].k==='word'){ ops.push({t:'new',name:cl[1].v,exprs:splitExprs(cl.slice(2),ln),actions:[]}); continue; }   // new NAME x, y inside logic (e.g. fire an arrow at hx, hy)
    if(cl[0].v==='bounce'){ // bounce [e]   e = bounciness 0..1 (default 1 = perfectly elastic)
      const e=cl[1]&&cl[1].k==='num'?cl[1].v:1; ops.push({t:'bounce',e});continue;}
    if(cl[0].v==='reset'){ops.push({t:'reset'});continue;}
    if(cl[0].v==='block'){ops.push({t:'block',name:cl[1]?.v});continue;}    // push NAME back out of what it hit
    if(cl[0].v==='push'){ops.push({t:'push',name:cl[1]?.v});continue;}      // NAME takes the other's speed along the contact (shove, no lag)
    if(cl[0].v==='scene'){ops.push({t:'scene',expr:cl.length>1?parseExpr(cl,{i:1}):{t:'num',v:1}});continue;}  // jump to room N (vars kept); `room` = current
    if(cl[0].v==='say'){const st=cl.find(t=>t.k==='str');ops.push({t:'say',text:st?st.v:''});continue;}  // message line
    if(cl[0].v==='set'){const p={i:2};ops.push({t:'set',name:cl[1]?.v,expr:cl.length>2?parseExpr(cl,p):{t:'num',v:0}});continue;}
    if(cl[0].v==='add'){const p={i:2};ops.push({t:'add',name:cl[1]?.v,expr:cl.length>2?parseExpr(cl,p):{t:'num',v:1}});continue;}
    if(cl[0].k==='word'&&!isVerb(cl[0].v)){ // NAME action
      ops.push({t:'act',name:cl[0].v,actions:parseActions(cl.slice(1),ln)});
    } else {
      ops.push({t:'act',name:null,actions:parseActions(cl,ln)});
    }
  }
  return ops;
}

/* ════════════════════════════════════════════════════════════════
   4. RUNTIME  — retained objects, init once, frame loop, collisions
   ════════════════════════════════════════════════════════════════ */
const cv=document.getElementById('view');
const cx=cv.getContext('2d');
let prog=null, objs=[], running=false, frameN=0, raf=0;
let lastObj=null;                 // implicit subject for bare actions
const named={};                   // name -> array of objects (lp makes many)
let vars={};                      // global variables (score, lives, etc.)
let resetFlag=false;              // set by `reset`; re-runs init next tick
let sceneN=1, pendingScene=0, pendingSide=null, doorCool=0;     // current room; pendingScene>0 = switch after this frame
let sayText='', sayLeft=0;        // message line + frames remaining (a countdown, so it survives
function say(txt){ sayText=txt; sayLeft=180; }   // the frame counter being reset, but still expires)
/* push `mover` fully out of `other` along the shallower overlap axis (other does not move) */
function pushOut(mover,other){
  const A=bounds(mover),B=bounds(other);
  const ox=Math.min(A.r,B.r)-Math.max(A.l,B.l), oy=Math.min(A.b,B.b)-Math.max(A.t,B.t);
  if(ox<=0||oy<=0) return;
  if(ox<oy){ const dir=(A.l+A.r)/2<(B.l+B.r)/2?-1:1; placeX(mover,mover.x+dir*ox); }
  else     { const dir=(A.t+A.b)/2<(B.t+B.b)/2?-1:1; placeY(mover,mover.y+dir*oy); }
}
/* shared executor for the simple (object-free) ops; returns true if it handled the op */
function globalOp(op,env){
  if(op.t==='reset'){ resetFlag=true; return true; }
  if(op.t==='scene'){ pendingScene=Math.max(1,Math.round(evalExpr(op.expr,env))); return true; }
  if(op.t==='say'){ say(op.text); return true; }
  if(op.t==='new'){ runNew(op); return true; }
  if(op.t==='set'){ vars[op.name]=evalExpr(op.expr,env); return true; }
  if(op.t==='add'){ vars[op.name]=(vars[op.name]||0)+evalExpr(op.expr,env); return true; }
  return false;
}
let keyState=0, mouse={x:0,y:0};

function newObj(spawn,env){
  const E=spawn.exprs.map(e=>evalExpr(e,env));
  const o={kind:spawn.verb,x:0,y:0,w:10,h:10,r:6,x2:0,y2:0,
           vx:0,vy:0,rotd:0,sx:1,sy:1,fill:false,fixed:false,
           col:[255,255,255],txt:spawn.str||'',livevar:spawn.livevar||null,alive:true,
           leader:null,gap:0,hist:[],chain:null,   // follow link + position history
           parent:null,ox:0,oy:0};                 // attach: ride on parent at offset
  switch(spawn.verb){
    case 'box': o.x=E[0]||0;o.y=E[1]||0;o.w=E[2]||10;o.h=E[3]||10;break;
    case 'tri': o.x=E[0]||0;o.y=E[1]||0;o.w=E[2]||10;o.h=E[3]||10;break;
    case 'oval':o.x=E[0]||0;o.y=E[1]||0;o.w=E[2]||10;o.h=E[3]||10;break;
    case 'circ':o.x=E[0]||0;o.y=E[1]||0;o.r=E[2]||6;o.w=o.h=o.r*2;break;
    case 'line':o.x=E[0]||0;o.y=E[1]||0;o.x2=E[2]||0;o.y2=E[3]||0;break;
    case 'dot': o.x=E[0]||0;o.y=E[1]||0;o.w=o.h=2;break;
    case 'txt': o.x=E[0]||0;o.y=E[1]||0;break;
  }
  return o;
}

/* axis-aligned bounds of any object: {l,t,r,b, cx,cy} */
/* hit box = the object's own shape plus everything attached to it,
   so a key with a ring, or a hero with a head, is as big as it looks. */
function bounds(o){
  let B=ownBounds(o);
  if(o.parts&&o.parts.length){
    B={...B};
    for(const c of o.parts){ if(!c.alive)continue; const cb=bounds(c);
      if(cb.l<B.l)B.l=cb.l; if(cb.t<B.t)B.t=cb.t; if(cb.r>B.r)B.r=cb.r; if(cb.b>B.b)B.b=cb.b; }
  }
  return B;
}
function ownBounds(o){
  if(o.kind==='circ') return {l:o.x-o.r,t:o.y-o.r,r:o.x+o.r,b:o.y+o.r};
  if(o.kind==='line') return {l:Math.min(o.x,o.x2),t:Math.min(o.y,o.y2),r:Math.max(o.x,o.x2),b:Math.max(o.y,o.y2)};
  if(o.kind==='dot')  return {l:o.x-1,t:o.y-1,r:o.x+1,b:o.y+1};
  return {l:o.x,t:o.y,r:o.x+o.w,b:o.y+o.h};            // box, tri, txt
}
/* move an object so its edge sits exactly against a surface on one axis */
function placeX(o,nx){const d=nx-o.x;o.x+=d;if(o.kind==='line')o.x2+=d;}
function placeY(o,ny){const d=ny-o.y;o.y+=d;if(o.kind==='line')o.y2+=d;}

function applyAction(o,a,env,against){
  const E=a.exprs?a.exprs.map(e=>evalExpr(e,env)):[];
  switch(a.verb){
    case 'mv': if(o.parent){o.ox+=E[0]||0;o.oy+=E[1]||0;break;}           // attached: move the offset
               o.x+=E[0]||0;o.y+=E[1]||0; if(o.kind==='line'){o.x2+=E[0]||0;o.y2+=E[1]||0;} break;
    case 'to': {if(o.parent){o.ox=E[0]||0;o.oy=E[1]||0;break;}             // attached: set the offset
               const nx=E[0]||0,ny=E[1]||0; o.x=nx;o.y=ny; o.hist=[]; break;}  // absolute; clear trail
    case 'chase':{const L=named[a.target]||[]; const T=L[L.length-1]; if(!T||o.parent) break;
      const A=bounds(o),B=bounds(T); const dx=(B.l+B.r)/2-(A.l+A.r)/2, dy=(B.t+B.b)/2-(A.t+A.b)/2;
      const d=Math.hypot(dx,dy)||1, sp=E[0]!==undefined?E[0]:1;
      o.vx=dx/d*sp; o.vy=dy/d*sp; break;}
    case 'attach':{const L=named[a.parent]||[]; const P=L[L.length-1];   // newest member of that group
      if(P&&P!==o){ o.parent=P; o.ox=E[0]||0; o.oy=E[1]||0; o.vx=0; o.vy=0; }
      break;}
    case 'vel':if(o.leader)break; o.vx=E[0]||0;o.vy=E[1]||0;break;
    case 'rot':o.rotd+=E[0]||0;break;
    case 'scl':{const f=E[0]||1;o.sx*=f;o.sy*=f;o.w*=f;o.h*=f;o.r*=f;break;}
    case 'shape':{ o.w=E[0]||0; o.h=E[1]||0; o.r=Math.min(o.w,o.h)/2; break; }   // absolute width, height (top-left stays)
    case 'size':{const s=E[0]||1;
      if(o.kind==='box'||o.kind==='tri'||o.kind==='oval'){ o.x+=(o.w-s)/2; o.y+=(o.h-s)/2; }  // keep center put
      o.w=s;o.h=s;o.r=s/2;break;}  // absolute size
    case 'flip':{ // bounce: reverse velocity on axis. Separation is handled by the engine's
      // swept resolver, so flip only has to decide the new direction.
      // If an axis isn't given, infer it from the contact: hit mostly left/right -> x, else y.
      let ax=a.axis;
      if(ax===undefined && against){
        const A=bounds(o), W=bounds(against);
        const ox=Math.min(A.r,W.r)-Math.max(A.l,W.l);   // x overlap depth
        const oy=Math.min(A.b,W.b)-Math.max(A.t,W.t);   // y overlap depth
        ax = ox<oy ? 0 : 1;   // shallower axis is the contact axis
      }
      if(ax===undefined) ax=2;
      if(ax===0||ax===2) o.vx=-o.vx;
      if(ax===1||ax===2) o.vy=-o.vy;
      break;}
    case 'col':o.col=[E[0]|0,E[1]|0,E[2]|0];break;
    case 'fill':o.fill=true;break;
    case 'unfill':o.fill=false;break;
    case 'fixed':o.fixed=true;o.vx=0;o.vy=0;break;
    case 'follow':{ // link o to trail a leader object by path-history
      const L=(named[a.leader]||[])[0];
      if(L){ o.leader=L; o.gap=a.gap!=null?a.gap:Math.max(1,Math.round((o.w||o.r*2))); 
             o.chain = L.chain || L; }  // chain root = the head everyone ultimately follows
      break;}
    case 'grow':{ // add a new segment to the tail of a chain and link it
      const chainName=a.gname||null;
      growChain(o,chainName);
      break;}
  }
}

/* path-history follow: each frame, followers copy their leader's position from
   `gap` frames ago (stored in leader.hist). Call AFTER leaders have moved. */
function updateFollowers(){
  // record every object's current center into its history ring
  for(const o of objs){
    o.hist.push({x:o.x,y:o.y});
    if(o.hist.length>240) o.hist.shift();  // cap memory (~4s at 60fps)
  }
  // place each follower back along the CHAIN ROOT's path, at a cumulative
  // distance = its depth in the chain * gap. One clean path = exact, drift-free spacing.
  for(const o of objs){
    if(!o.leader) continue;
    const root=o.chain||o.leader;
    if(!root||!root.alive) continue;
    // depth: how many links from root to this follower
    let depth=0, p=o;
    while(p && p!==root && depth<9999){ depth++; p=p.leader; }
    const h=root.hist;
    if(h.length<2) continue;
    let need=o.gap*depth, i=h.length-1;
    while(i>0 && need>0){
      const dx=h[i].x-h[i-1].x, dy=h[i].y-h[i-1].y;
      const seg=Math.hypot(dx,dy);
      if(seg>=need){ const f=need/seg; o.x=h[i].x-dx*f; o.y=h[i].y-dy*f; need=0; break; }
      need-=seg; i--;
    }
    if(need>0 && i<=0){ o.x=h[0].x; o.y=h[0].y; }
  }
}

/* attached parts ride on their parent: x = parent.x + offset. Two passes so parts
   of parts settle in one frame. A part dies with its parent. */
function updateAttached(){
  for(const o of objs) o.parts=null;
  for(const o of objs){ const P=o.parent; if(P){ (P.parts=P.parts||[]).push(o); } }
  for(let pass=0;pass<2;pass++){
    for(const o of objs){
      const P=o.parent; if(!P) continue;
      if(!P.alive){ o.alive=false; continue; }
      const dx=P.x+o.ox-o.x, dy=P.y+o.oy-o.y;
      o.x+=dx; o.y+=dy; if(o.kind==='line'){o.x2+=dx;o.y2+=dy;}
    }
  }
}

/* grow: spawn a segment copying the tail's look, linked to follow the current tail.
   `seed` is any object in the chain (usually the head); segments collect under
   the chain's name list so they render and persist. */
function growChain(seed, chainName){
  // find the tail: walk followers of the chain root
  const root = seed.chain || seed;
  // tail = the object in objs whose leader is the deepest in this chain
  let tail=root, members=[root];
  let changed=true;
  while(changed){
    changed=false;
    for(const o of objs){ if(o.leader===tail){ tail=o; members.push(o); changed=true; break; } }
  }
  const seg={...tail, x:tail.x, y:tail.y, hist:[], leader:tail,
             gap: Math.max(1,Math.round((tail.w||tail.r*2))), chain:root, alive:true};
  // fresh arrays (spread copied references)
  seg.col=[...tail.col];
  seg.vx=0; seg.vy=0;                    // followers never carry their own velocity
  objs.push(seg);
  // register the segment under the group the current tail belongs to (e.g. "tail"),
  // NOT under the head's name — otherwise `head vel` / `on hit head ...` would start
  // steering and scoring with the body. Fall back to chainName only if the tail is unnamed.
  let group=null;
  for(const k in named){ if(named[k].includes(tail)){ group=k; break; } }
  if(!group && chainName) group=chainName;
  if(group){ (named[group]=named[group]||[]).push(seg); }
}

function runMake(st,phase){
  const N=typeof st.loop==='number'?st.loop:Math.max(1,evalExpr(st.loop,baseEnv(0)));
  for(let i=0;i<N;i++){
    const env=baseEnv(i);
    if(st.spawn){
      const o=newObj(st.spawn,env);
      const G=st.name&&named[st.name]; const T=G&&G[G.length-1];   // template: newest member of this name
      if(T&&T.kind===o.kind){           // same name = same look unless this line says otherwise
        o.fill=T.fill; o.col=[...T.col]; o.fixed=T.fixed;
        const n=st.spawn.exprs.length;  // size omitted? inherit it too
        if(o.kind==='box'||o.kind==='tri'||o.kind==='oval'){ if(n<3){o.w=T.w;} if(n<4){o.h=T.h;} }
        if(o.kind==='circ'&&n<3){ o.r=T.r; o.w=o.h=T.r*2; }
      }
      o.idx=i;                          // remember spawn index so when/each can use `i`
      o.group=st.name||null;            // group name, used to decide which pairs are solid
      for(const a of st.actions) applyAction(o,a,env);
      objs.push(o); lastObj=o;
      if(st.name){ (named[st.name]=named[st.name]||[]).push(o); }
    } else {
      // reference / implicit subject actions (per frame)
      const targets = st.name? (named[st.name]||[]) : (lastObj?[lastObj]:[]);
      for(const o of targets){ for(const a of st.actions) applyAction(o,a,env); }
    }
  }
}

function baseEnv(i){ const h=(named.hero||[]).find(o=>o.alive); return {t:frameN,i,key:keyState,mx:mouse.x,my:mouse.y,rn:Math.random(),rm:Math.random(),room:sceneN,hx:h?h.x:0,hy:h?h.y:0,...vars};}   // hx, hy = the hero
/* rn, rm = two random numbers 0..1, fixed for the whole statement (so `to sin(a)*rn, cos(a)*rn` is consistent) */
/* env for per-object conditions: base vars plus this object's live properties */
function objEnv(o){return {...baseEnv(0), i:(o.idx||0), x:o.x, y:o.y, w:o.w, h:o.h, r:o.r,
  size:(o.kind==='circ'?o.r*2:o.w), vx:o.vx, vy:o.vy};}

/* mass = bounding-box area (w*h). fixed objects are immovable (infinite mass).
   dot/line get a small floor so they still participate in separation. */
function mass(o){ if(o.fixed) return Infinity; const B=bounds(o); return Math.max(4,(B.r-B.l)*(B.b-B.t)); }

/* static AABB overlap (used for event firing and as the fallback test) */
function overlap(a,b){
  const A=bounds(a),B=bounds(b);
  return A.l<B.r && A.r>B.l && A.t<B.b && A.b>B.t;
}

/* Swept AABB: will A (moving by rel velocity rvx,rvy this frame) hit static B?
   Returns time-of-impact t in [0,1] and the contact axis, or null if no hit. */
function sweptAABB(A,rvx,rvy,B){
  // expand B by A's half-size -> reduces A to a point moving from its center
  const aw=A.r-A.l, ah=A.b-A.t;
  const acx=(A.l+A.r)/2, acy=(A.t+A.b)/2;
  const ex={l:B.l-aw/2, r:B.r+aw/2, t:B.t-ah/2, b:B.b+ah/2};
  // entry/exit times on each axis
  let xEntry,xExit,yEntry,yExit;
  if(rvx>0){xEntry=(ex.l-acx)/rvx; xExit=(ex.r-acx)/rvx;}
  else if(rvx<0){xEntry=(ex.r-acx)/rvx; xExit=(ex.l-acx)/rvx;}
  else {xEntry=-Infinity; xExit=Infinity; if(acx<ex.l||acx>ex.r) return null;}
  if(rvy>0){yEntry=(ex.t-acy)/rvy; yExit=(ex.b-acy)/rvy;}
  else if(rvy<0){yEntry=(ex.b-acy)/rvy; yExit=(ex.t-acy)/rvy;}
  else {yEntry=-Infinity; yExit=Infinity; if(acy<ex.t||acy>ex.b) return null;}
  const entry=Math.max(xEntry,yEntry), exit=Math.min(xExit,yExit);
  if(entry>exit || entry<0 || entry>1) return null;    // no hit this frame
  const axis = xEntry>yEntry ? 0 : 1;                  // which face was crossed first
  return {t:entry, axis};
}

/* elastic momentum exchange along the contact normal, weighted by w*h mass.
   A fixed object acts as infinite mass: the mover reflects, the fixed one stays. */
function bouncePair(a,b,e=1){
  const A=bounds(a),B=bounds(b);
  const ox=Math.min(A.r,B.r)-Math.max(A.l,B.l);
  const oy=Math.min(A.b,B.b)-Math.max(A.t,B.t);
  // contact normal = shallower overlap axis
  const axis = (ox<oy)?0:1;
  const ma=mass(a), mb=mass(b);
  // e scales the velocity relative to the centre of mass after the exchange:
  // e=1 elastic, e=0 the pair stops dead on that axis (a ball resting on a floor).
  const k=axis===0?'vx':'vy';
  const ua=a[k], ub=b[k];
  // only respond if the pair is closing on this axis; something already moving away
  // (a jump starting while still touching the floor) must not be cancelled
  const ca=axis===0?(A.l+A.r)/2:(A.t+A.b)/2, cb=axis===0?(B.l+B.r)/2:(B.t+B.b)/2;
  const toward=cb>ca?1:-1;                 // direction from a to b
  if((ua-ub)*toward<=0) return;            // separating or at rest relative to each other
  if(ma===Infinity){ b[k]=-ub*e; }
  else if(mb===Infinity){ a[k]=-ua*e; }
  else {
    const vc=(ma*ua+mb*ub)/(ma+mb);
    const na=((ma-mb)*ua+2*mb*ub)/(ma+mb), nb=((mb-ma)*ub+2*ma*ua)/(ma+mb);
    a[k]=vc+(na-vc)*e; b[k]=vc+(nb-vc)*e;
  }
  if(Math.abs(a[k])<0.05) a[k]=0; if(Math.abs(b[k])<0.05) b[k]=0;   // settle instead of micro-jitter
}

/* chain distance between two objects that share a follow-chain (Infinity if unrelated).
   Used so a snake head doesn't "collide" with the segments right behind it. */
function chainDist(a,b){
  let d=0,p=a; while(p&&d<9999){ if(p===b) return d; p=p.leader; d++; }
  d=0;p=b; while(p&&d<9999){ if(p===a) return d; p=p.leader; d++; }
  return Infinity;
}

function runEvent(st){
  const A=named[st.a]||[], B=named[st.b]||[];
  for(const a of A){ if(!a.alive)continue;
    for(const b of B){ if(!b.alive)continue;
      if(a===b) continue;
      if((a.kind==='box'&&(a.w<=0||a.h<=0))||(b.kind==='box'&&(b.w<=0||b.h<=0))) continue;   // a shape 0 box is nothing
      if(st.a===st.b && A.indexOf(a)>A.indexOf(b)) continue;   // same group: handle each pair once
      // self-collision guard: ignore segments within 2 links in the same chain
      const cd=chainDist(a,b); if(cd<=2) continue;
      if(overlap(a,b) || touched(a,b)){
        let destroyed=false;
        let physical=false;  // did this event produce a solid response (flip/bounce)?
        for(const op of st.logic){
          if(op.t==='destroy'){
            const kill = op.name===st.a? a : op.name===st.b? b : null;
            if(kill){kill.alive=false; if(kill===a||kill===b) destroyed=true;}
          } else if(op.t==='bounce'){
            bouncePair(a,b,op.e); physical=true;
          } else if(op.t==='push'){             // shove: the pushed thing moves at the pusher's speed right now
            const pushed = op.name===st.b? b : a, pusher = pushed===a? b : a;
            const A=bounds(pusher),B=bounds(pushed);
            const ox=Math.min(A.r,B.r)-Math.max(A.l,B.l), oy=Math.min(A.b,B.b)-Math.max(A.t,B.t);
            const k = ox<oy ? 'vx' : 'vy';
            const dir = k==='vx' ? Math.sign((B.l+B.r)-(A.l+A.r)) : Math.sign((B.t+B.b)-(A.t+A.b));
            if(pusher[k]*dir > pushed[k]*dir) pushed[k]=pusher[k];       // only ever speed it up, never pull back
            physical=true;
          } else if(op.t==='block'){            // solid stop for a key-moved object
            const mover = op.name===st.b? b : a;
            pushOut(mover, mover===a? b : a);
          } else if(globalOp(op,baseEnv(0))){
          } else { // act — pass the OTHER object as the surface we hit (drives flip axis)
            const actsOnA = op.name===st.a || (op.name==null);
            const tgt = op.name===st.a? a : op.name===st.b? b : (op.name?named[op.name]:[a]);
            const partner = actsOnA? b : a;
            const list=Array.isArray(tgt)?tgt:[tgt];
            for(const o of list){ if(o&&o.alive) for(const ac of op.actions){ applyAction(o,ac,baseEnv(0),partner); if(ac.verb==='flip')physical=true; } }
          }
          if(resetFlag||pendingScene) break;
        }
        // separate only for solid responses; triggers (eat/score/destroy) pass through
        if(physical && !destroyed && a.alive && b.alive) separate(a,b);
      }
    }
  }
}

let consumed=new Set();   // things taken or killed in rooms already visited: they stay gone when you come back (a fresh run clears it)
function doInit(scene,keepVars){
  objs=[]; for(const k in named) delete named[k]; lastObj=null; frameN=0;
  if(!keepVars){ vars={}; consumed=new Set(); }   // say-text is kept so a final message survives reset
  resetFlag=false; pendingScene=0; sceneN=scene||1;
  const sceneSts=prog.scenes[sceneN]||prog.init;
  for(const st of [...sceneSts, ...(prog.common||[])]){
    if(st.t==='make') runMake(st,'init');
    else if(st.t==='start'){ if(!keepVars&&st.n!==sceneN){ pendingScene=st.n; pendingSide='none'; } }
    else if(st.t==='destroy'){ (named[st.name]||[]).forEach(o=>o.alive=false); }
    else if(st.t==='set'){ if(keepVars&&sceneSts===prog.init&&st.name in vars) continue; vars[st.name]=evalExpr(st.expr,baseEnv(0)); }   // room 1's starting values apply once
    else if(st.t==='add'){ vars[st.name]=(vars[st.name]||0)+evalExpr(st.expr,baseEnv(0)); }
    else if(st.t==='if'){ runIf(st); }
    else if(st.t==='new'){
      if(sceneSts.includes(st)){ const E=st.exprs.map(e=>evalExpr(e,baseEnv(0))); const key=sceneN+':'+st.name+':'+E.join(',');
        if(consumed.has(key)) continue;                                              // already taken or killed
        runNew(st); const o=(named[st.name]||[]).slice(-1)[0]; if(o) o.wkey=key; }
      else runNew(st); }
    else if(st.t==='map'){ runMap(st); }
  }
  updateAttached();
}

/* map NAME ["seed"] — a code as a level.
   No seed: the level IS this program's save code (what "save -> code" shows), module for module:
   the frame is the wall, the data is the maze. Editing any byte changes it.
   With seed text: that text's QR code at full resolution, isolated dark modules dropped.
   Dark modules become fixed boxes named NAME.
   Sets vars:
     cell        size of one module in px
     mx1,my1     top-left corner of a free cell near the top-left, inside the main open region
     mx2,my2     ... near the bottom-right      mx3,my3 top-right      mx4,my4 bottom-left */
function runMap(st){
  let q,N,g,cgrid=null;   // cgrid: 0..7 colour indices when the map is the colour save code
  try{
    if(st.seed!=null){                           // seed text: that code, full resolution, thinned
      q=qrcode(0,'L'); q.addData(st.seed,'Byte'); q.make(); N=q.getModuleCount();
      const D=[]; for(let r=0;r<N;r++){ D.push([]); for(let c=0;c<N;c++) D[r].push(q.isDark(r,c)?1:0); }
      g=D.map((row,r)=>row.map((v,c)=>v&&(row[c+1]||row[c-1]||(D[r+1]||[])[c]||(D[r-1]||[])[c])?1:0));
    } else {                                     // no seed: THE SAVE CODE of this program, module for module
      const enc=mcode.encodeColor(packBin(prog.src)); N=enc.N; cgrid=enc.grid;
      g=cgrid.map(r=>Uint8Array.from(r,v=>v<4?1:0));
    }
  }catch(e){   // the QR / deflate libraries load from a CDN: offline, `map` cannot build the code. Say so, and give cell a usable size.
    vars.cell=vars.cell||16; setStatus('map: needs the QR libraries from the internet — '+(e&&e.message||e),true); return; }
  const cell=cv.width/N; vars.cell=cell;
  const env=baseEnv(0);
  // colour code: wall colour follows the module (black/blue/red/green, dimmed); floor colours are carpets
  const WALLCOL=[[70,70,90],[50,80,200],[190,50,50],[40,150,70]], FLOORCOL=[null,[60,58,30],[26,54,62],[62,30,56]];
  if(cgrid){ for(let r=1;r<N-1;r++){ let c=1; while(c<N-1){ const v=cgrid[r][c]; if(v<4||v===4){c++;continue;} let c2=c; while(c2<N-1&&cgrid[r][c2]===v) c2++;
      const o=newObj({verb:'box',exprs:[]},env); o.x=c*cell; o.y=r*cell; o.w=(c2-c)*cell; o.h=cell; o.fill=true; o.fixed=true; o.col=FLOORCOL[v-4]; o.group=null; objs.push(o); c=c2; } } }
  for(let r=0;r<N;r++){
    let c=0;
    while(c<N){
      if(!g[r][c]){ c++; continue; }
      const v=cgrid?cgrid[r][c]:0; let c2=c; while(c2<N&&g[r][c2]&&(!cgrid||cgrid[r][c2]===v)) c2++;
      const o=newObj({verb:'box',exprs:[]},env);
      o.x=c*cell; o.y=r*cell; o.w=(c2-c)*cell; o.h=cell; o.fill=true; o.fixed=true; o.col=[...WALLCOL[v]];
      o.group=st.name; for(const a of st.actions) applyAction(o,a,env);
      objs.push(o); lastObj=o; (named[st.name]=named[st.name]||[]).push(o);
      c=c2;
    }
  }
  // largest connected open region; anchors are its cells nearest each corner
  const id=g.map(r=>Array.from(r,()=>-1)); const sizes=[]; let k=0;   // (Array.from: rows may be Uint8Array)
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){ if(g[r][c]||id[r][c]>=0)continue; let n=0; const Q=[[r,c]]; id[r][c]=k;
    while(Q.length){ const [a,b]=Q.pop(); n++; for(const [dr,dc] of [[1,0],[-1,0],[0,1],[0,-1]]){ const x=a+dr,y=b+dc; if(x<0||y<0||x>=N||y>=N||g[x][y]||id[x][y]>=0)continue; id[x][y]=k; Q.push([x,y]); } }
    sizes.push(n); k++; }
  const main=sizes.indexOf(Math.max(...sizes));
  const near=(r0,c0)=>{ let best=null,bd=1e9; for(let r=0;r<N;r++)for(let c=0;c<N;c++){ if(id[r][c]!==main)continue; const d=(r-r0)*(r-r0)+(c-c0)*(c-c0); if(d<bd){bd=d;best=[c*cell,r*cell];} } return best||[cell,cell]; };
  [vars.mx1,vars.my1]=near(1,1); [vars.mx2,vars.my2]=near(N-2,N-2);
  [vars.mx3,vars.my3]=near(0,N-1); [vars.mx4,vars.my4]=near(N-1,0);
}

/* new NAME x, y : actions — stamp out a def: run its statements, shift the root to x,y,
   then apply the extra actions to the root (parts ride along via attach). */
function runNew(st){
  const D=prog.defs[st.name]; if(!D){ return; }
  const env=baseEnv(0); const E=st.exprs.map(e=>evalExpr(e,env));
  const before=(named[st.name]||[]).length;
  for(const d of D){ if(d.t==='make') runMake(d,'init'); else if(d.t==='new') runNew(d); }
  const root=(named[st.name]||[])[before]; if(!root) return;
  root.x+=E[0]||0; root.y+=E[1]||0; if(root.kind==='line'){root.x2+=E[0]||0;root.y2+=E[1]||0;}
  for(const a of st.actions) applyAction(root,a,env);
  lastObj=root;
}

/* if COND : logic — global condition, runs once per frame */
function runIf(st){
  const env=baseEnv(0);
  if(!evalExpr(st.cond,env)) return;
  for(const op of st.logic){
    if(globalOp(op,env)) continue;
    if(op.t==='destroy'){ (named[op.name]||[]).forEach(o=>o.alive=false); }
    else if(op.t==='act'){ const list=op.name?(named[op.name]||[]):(lastObj?[lastObj]:[]);
      for(const o of list){ if(o&&o.alive) for(const ac of op.actions) applyAction(o,ac,env); } }
    if(resetFlag) break;
  }
}

/* separate two overlapping objects along the shallower axis, split by inverse mass.
   fixed objects don't move; the movable one takes the full push. */
function separate(a,b){
  const A=bounds(a),B=bounds(b);
  const ox=Math.min(A.r,B.r)-Math.max(A.l,B.l);   // x penetration
  const oy=Math.min(A.b,B.b)-Math.max(A.t,B.t);   // y penetration
  if(ox<=0||oy<=0) return;
  const ma=mass(a),mb=mass(b);
  const inv=1/((ma===Infinity?0:1/ma)+(mb===Infinity?0:1/mb)||1);
  const shareA = ma===Infinity?0:(mb===Infinity?1:(1/ma)/((1/ma)+(1/mb)));
  const shareB = 1-shareA;
  if(ox<oy){ // push on x
    const dir = (A.l+A.r)/2 < (B.l+B.r)/2 ? -1 : 1;
    placeX(a, a.x + dir*ox*shareA);
    placeX(b, b.x - dir*ox*shareB);
  } else {   // push on y
    const dir = (A.t+A.b)/2 < (B.t+B.b)/2 ? -1 : 1;
    placeY(a, a.y + dir*oy*shareA);
    placeY(b, b.y - dir*oy*shareB);
  }
}

/* advance every object along its velocity, stopping movers at the earliest
   swept contact so nothing tunnels — even two movers (relative velocity).
   Each object independently consumes its frame-time in up to a few hops. */
let contacts=[];   // [[objA,objB], ...] pairs that touched this frame (either direction)
function touched(a,b){ for(const c of contacts){ if((c[0]===a&&c[1]===b)||(c[0]===b&&c[1]===a)) return true; } return false; }

/* two objects resting against each other (touching within a hair on one axis, overlapping on the other) */
function adjacent(a,b){
  const A=bounds(a),B=bounds(b);
  const gx=Math.max(B.l-A.r, A.l-B.r), gy=Math.max(B.t-A.b, A.t-B.b);
  return (gx<=0.01&&gy<0)||(gy<=0.01&&gx<0);
}
function integrateWithSweep(){
  const EPS=0.001;
  // contacts persist while the pair is still resting together, so a thing standing on a
  // floor stays "touching" every frame (jump checks, bounce 0) instead of every other frame
  const prev=contacts; contacts=[];
  for(const o of objs){
    if(o.fixed || o.leader || o.parent) continue;   // followers/parts are placed by their leader/parent
    let trem=1;                                  // fraction of this frame left to spend
    for(let hop=0; hop<4 && trem>EPS; hop++){
      const A=bounds(o);
      let best=1, hitObj=null;
      for(const q of objs){
        if(q===o||!q.alive) continue;
        // only SOLID obstacles stop a mover: fixed objects (walls) or other movers.
        // a non-fixed, stationary object is a trigger/pickup -> pass through it.
        const qSolid = q.fixed || (!q.leader && !q.parent && (q.vx!==0 || q.vy!==0));
        if(!qSolid) continue;
        // two things only block each other if the program listens for their collision;
        // otherwise (e.g. a field of stars) they pass through freely instead of clumping.
        if(!prog.hits.has(o.group+'|'+q.group)) continue;
        const rvx=o.vx-(q.fixed?0:q.vx);
        const rvy=o.vy-(q.fixed?0:q.vy);
        if(rvx===0&&rvy===0) continue;
        const r=sweptAABB(A, rvx*trem, rvy*trem, bounds(q));
        if(!r) continue;
        // an obstacle BEHIND us (we're moving away from it, it's catching up) is its problem,
        // not ours: without this a pushed ball stalls while the pusher keeps pressing.
        const QB=bounds(q);
        if(r.axis===0){ const d=Math.sign((QB.l+QB.r)-(A.l+A.r)); if(o.vx*d<=0) continue; }
        else          { const d=Math.sign((QB.t+QB.b)-(A.t+A.b)); if(o.vy*d<=0) continue; }
        if(r.t<best){ best=r.t; hitObj=q; }
      }
      // advance to the contact fraction (leave a hair short so we rest ON the face)
      const f = hitObj ? Math.max(0, best - EPS) * trem : trem;
      o.x+=o.vx*f; o.y+=o.vy*f; if(o.kind==='line'){o.x2+=o.vx*f;o.y2+=o.vy*f;}
      trem-=f;
      if(!hitObj) break;                          // clear path -> done
      contacts.push([o,hitObj]);                  // remember the touch so the event fires
      break;                                       // rest at contact; event flips velocity next
    }
  }
  // carry over last frame's contacts that are STILL resting together after this move
  for(const c of prev){ if(c[0].alive&&c[1].alive&&!touched(c[0],c[1])&&adjacent(c[0],c[1])) contacts.push(c); }
}

function step(){
  frameN++; if(doorCool>0) doorCool--;
  if(sayLeft>0 && --sayLeft===0) sayText='';
  integrateWithSweep();
  // frame block: actions, key events, collision events, variable ops
  for(const st of prog.frame){
    if(st.t==='make') runMake(st,'frame');
    else if(st.t==='on_hit') runEvent(st);
    else if(st.t==='on_key') runKey(st);
    else if(st.t==='destroy'){ (named[st.name]||[]).forEach(o=>o.alive=false); }
    else if(st.t==='set'){ vars[st.name]=evalExpr(st.expr,baseEnv(0)); }
    else if(st.t==='add'){ vars[st.name]=(vars[st.name]||0)+evalExpr(st.expr,baseEnv(0)); }
    else if(st.t==='when'){ runWhen(st); }
    else if(st.t==='if'){ runIf(st); }
    else if(st.t==='new'){ runNew(st); }
    else if(st.t==='reset'){ resetFlag=true; }
    if(resetFlag) break;             // a reset short-circuits the rest of the frame
  }
  if(resetFlag){ doInit(1,false); draw(); return; }   // restart cleanly next tick
  { const h=(named.hero||[]).find(o=>o.alive); if(h&&!pendingScene){ const B=bounds(h); const cx=(B.l+B.r)/2, cy=(B.t+B.b)/2;   // no door took the hero: keep it in the room
      if(cx<2) h.x+=2-cx; else if(cx>318) h.x-=cx-318; if(cy<2) h.y+=2-cy; else if(cy>318) h.y-=cy-318; updateAttached(); } }
  if(!pendingScene&&doorCool===0){ const h=(named.hero||[]).find(o=>o.alive); if(h){ const B=ownBounds(h);   // goN: a door to room N, no frame line needed
      for(const o of objs){ const m=o.alive&&o.group&&/^go(\d+)$/.exec(o.group); if(!m) continue; const C=bounds(o);
        if(B.l<C.r&&B.r>C.l&&B.t<C.b&&B.b>C.t){ pendingScene=+m[1]; pendingSide=sideOf(o); break; } } } }
  if(pendingScene){
    const n=pendingScene; const h=(named.hero||[]).find(o=>o.alive); let cx=null,cy=null; if(h){ const B=bounds(h); cx=(B.l+B.r)/2; cy=(B.t+B.b)/2; }
    doInit(n,true);                                                            // room change, keep vars
    const h2=(named.hero||[]).find(o=>o.alive);                                // the hero enters where it left: mirrored across the side it crossed
    let side=pendingSide; pendingSide=null;
    if(!side&&cx!==null){ const d=[['left',cx],['right',320-cx],['top',cy],['bottom',320-cy]].sort((a,b)=>a[1]-b[1])[0]; if(d[1]<=40) side=d[0]; }
    if(h&&h2&&cx!==null&&side&&side!=='none'){ let nx=cx,ny=cy; if(side==='right')nx=WT+10; else if(side==='left')nx=320-WT-10; else if(side==='bottom')ny=WT+10; else ny=320-WT-10;
      if(nx!==cx||ny!==cy){ const B=bounds(h2); h2.x+=nx-(B.l+B.r)/2; h2.y+=ny-(B.t+B.b)/2; updateAttached();
        const B2=bounds(h2); if(B2.t<WT+2) h2.y+=WT+2-B2.t; if(B2.b>320-WT-2) h2.y-=B2.b-(320-WT-2); if(B2.l<WT+2) h2.x+=WT+2-B2.l; if(B2.r>320-WT-2) h2.x-=B2.r-(320-WT-2); updateAttached(); }
      doorCool=20; }
    draw(); return; }
  updateFollowers();                 // chains trail their leaders (snake body)
  updateAttached();                  // parts ride on their parent (a "person")
  for(const o of objs) if(!o.alive&&o.wkey) consumed.add(o.wkey);        // taken or killed: stays gone when you come back
  objs=objs.filter(o=>o.alive);
  for(const k in named) named[k]=named[k].filter(o=>o.alive);
  draw();
}

/* NAME when COND : logic — for each object in NAME whose condition is true,
   run the logic on that object (per-object props available in the condition). */
function runWhen(st){
  const list=named[st.name]||[];
  for(const o of list){
    if(!o.alive) continue;
    if(evalExpr(st.cond, objEnv(o))){
      for(const op of st.logic){
        if(globalOp(op,objEnv(o))) continue;
        if(op.t==='destroy'){ o.alive=false; }
        else if(op.t==='act'){
          // act with no name -> this object; named -> that named group
          const targets = op.name? (named[op.name]||[]) : [o];
          for(const tg of targets){ if(tg&&tg.alive) for(const ac of op.actions) applyAction(tg,ac,objEnv(o)); }
        }
      }
    }
  }
}

/* on_key DIR : fires its logic while that arrow is held */
const keysHeld={up:false,down:false,left:false,right:false,hit:false};
function runKey(st){
  if(!keysHeld[st.dir]) return;
  for(const op of st.logic){
    if(globalOp(op,baseEnv(0))) continue;
    if(op.t==='destroy'){ (named[op.name]||[]).forEach(o=>o.alive=false); }
    else if(op.t==='bounce'||op.t==='block'||op.t==='push'){ /* n/a for key */ }
    else { const list = op.name? (named[op.name]||[]) : (lastObj?[lastObj]:[]);
           for(const o of list){ if(o&&o.alive) for(const ac of op.actions) applyAction(o,ac,baseEnv(0)); } }
  }
}

function draw(){
  cx.clearRect(0,0,cv.width,cv.height);
  cx.fillStyle='#05070b'; cx.fillRect(0,0,cv.width,cv.height);
  for(const o of objs){
    const color=`rgb(${o.col[0]},${o.col[1]},${o.col[2]})`;
    cx.save();
    cx.translate(o.x+(o.kind==='box'||o.kind==='tri'||o.kind==='oval'?o.w/2:0),
                 o.y+(o.kind==='box'||o.kind==='tri'||o.kind==='oval'?o.h/2:0));
    if(o.rotd) cx.rotate(o.rotd*Math.PI/180);
    cx.strokeStyle=color; cx.fillStyle=color; cx.lineWidth=1.5;
    if(o.kind==='box'){ const w=o.w,h=o.h; o.fill?cx.fillRect(-w/2,-h/2,w,h):cx.strokeRect(-w/2,-h/2,w,h); }
    else if(o.kind==='circ'){ cx.beginPath();cx.arc(0,0,Math.abs(o.r)||0,0,7);o.fill?cx.fill():cx.stroke(); }   // a shrunk-past-zero size draws mirrored, never throws
    else if(o.kind==='oval'){ cx.beginPath();cx.ellipse(0,0,Math.abs(o.w/2)||0,Math.abs(o.h/2)||0,0,0,7);o.fill?cx.fill():cx.stroke(); }
    else if(o.kind==='tri'){ const w=o.w,h=o.h; cx.beginPath();cx.moveTo(0,-h/2);cx.lineTo(w/2,h/2);cx.lineTo(-w/2,h/2);cx.closePath();o.fill?cx.fill():cx.stroke(); }
    else if(o.kind==='line'){ cx.beginPath();cx.moveTo(0,0);cx.lineTo(o.x2-o.x,o.y2-o.y);cx.stroke(); }
    else if(o.kind==='dot'){ cx.fillRect(-1,-1,2,2); }
    else if(o.kind==='txt'){ cx.font='16px monospace';
      const val=o.livevar!=null?(Math.round((vars[o.livevar]||0)*100)/100):'';
      cx.fillText(o.txt+val,0,0); }
    cx.restore();
  }
  if(sayText && sayLeft>0){                  // message line
    cx.save(); cx.font='13px monospace'; cx.textAlign='center';
    const w=Math.min(cv.width-16, cx.measureText(sayText).width+20);
    cx.fillStyle='rgba(5,7,11,.85)'; cx.fillRect((cv.width-w)/2,cv.height-34,w,24);
    cx.fillStyle='#e8ebf0'; cx.fillText(sayText,cv.width/2,cv.height-17); cx.restore();
  }
}

function loop(){ if(!running)return; step(); raf=requestAnimationFrame(loop); }

/* ════════════════════════════════════════════════════════════════
   5. DRIVE  (compile + run)
   ════════════════════════════════════════════════════════════════ */
const codeEl=document.getElementById('code');
const statusEl=document.getElementById('status');
const msgEl=document.getElementById('msg');
codeEl.value=STARTER;

/* examples menu: fill from the library, load + run on pick */
{
  const sel=document.getElementById('examples');
  EXAMPLES.forEach((ex,n)=>{ const o=document.createElement('option'); o.value=n; o.textContent=ex.name; sel.appendChild(o); });
  sel.onchange=()=>{
    const n=sel.value; if(n==='') return;
    codeEl.value=EXAMPLES[+n].src;
    sel.value='';                       // reset label so the same item can be re-picked
    run();
  };
}

function setStatus(txt,err){statusEl.classList.toggle('err',!!err);msgEl.textContent=txt;}

function run(){
  stop();
  prog=compile(codeEl.value);
  if(prog.err){setStatus(prog.err,true);return;}
  const n=prog.init.length+prog.frame.length;
  setStatus(`running · ${n} statements`,false);
  sayText=''; sayLeft=0;               // a new program starts with a clean message line
  doInit(); draw();
  running=true; raf=requestAnimationFrame(loop);
}
function stop(){running=false;cancelAnimationFrame(raf);}

document.getElementById('btn-run').onclick=()=>{ run(); if(isPhone()) setPlay(true); };
const isPhone=()=>window.matchMedia('(max-width:760px)').matches;
function setPlay(on){ document.body.classList.toggle('play',on); document.getElementById('btn-mode').textContent=on?'⌨ code':'🎮 play'; }
document.getElementById('btn-mode').onclick=()=>setPlay(!document.body.classList.contains('play'));
document.getElementById('btn-stop').onclick=()=>{stop();setStatus('stopped',false);};

/* input */
const ARROW={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',' ':'hit',z:'hit',Z:'hit',x:'hit',X:'hit'};
window.addEventListener('keydown',e=>{
  const d=ARROW[e.key]; if(d){keysHeld[d]=true; e.preventDefault();}
  if(e.key==='ArrowLeft')keyState=-1; if(e.key==='ArrowRight')keyState=1;
});
window.addEventListener('keyup',e=>{
  const d=ARROW[e.key]; if(d)keysHeld[d]=false;
  if(e.key==='ArrowLeft'&&keyState===-1)keyState=0; if(e.key==='ArrowRight'&&keyState===1)keyState=0;
});
cv.addEventListener('pointermove',e=>{const r=cv.getBoundingClientRect();mouse.x=(e.clientX-r.left)*cv.width/r.width;mouse.y=(e.clientY-r.top)*cv.height/r.height;});

/* touch / tap d-pad: the canvas is split into four triangles by its diagonals.
   Press-and-hold a side = hold that arrow. Drag across to change direction. */
let touchDir=null;
function touchToDir(e){
  const r=cv.getBoundingClientRect();
  const dx=(e.clientX-r.left)/r.width-0.5, dy=(e.clientY-r.top)/r.height-0.5;

/* ════════════════════════════════════════════════════════════════
   6. QR  save / load
   For v0.1 the QR payload is the source text itself (deflate-free),
   so a scanned QR *is* readable source. Bytecode packing comes next.
   ════════════════════════════════════════════════════════════════ */
const ov=document.getElementById('ov');
const card=document.getElementById('card');
function closeOv(){ov.classList.remove('open');card.innerHTML='';if(window._qrStop){window._qrStop();window._qrStop=null;}}

/* ── Dual packer ──────────────────────────────────────────────────
   QR payload = 2-char marker + base64(bytes). Two schemes, smaller wins:
     QD = deflate(source)                 generic fallback
     QB = deflate(bytecode(source))       keyword-tokenized, then deflated
   v0.14+: saved codes are BINARY ('Q','Z' + raw deflate of bytecode), see packBin.
   Bytecode replaces each known keyword with one high byte (128+), so the
   pre-deflate stream is shorter and more regular -> smaller after deflate.
   It round-trips exactly back to readable source. ─────────────────── */
function toB64(bytes){let s='';for(let i=0;i<bytes.length;i++)s+=String.fromCharCode(bytes[i]);return btoa(s);}

// token table: every reserved word -> a byte 128..255. Order fixed = stable codes.
/* source as saved: comments and blank/trailing whitespace dropped (the editor keeps them) */
function stripForSave(src){
  return src.split('\n').map(l=>{
    let out='',q=false;
    for(const c of l){ if(c==='"')q=!q; if(c==='#'&&!q)break; out+=c; }
    return out.replace(/\s+$/,'');

}
const TOKENS=['init','frame','on','hit','key','up','down','left','right',
  'box','circ','tri','line','dot','txt','mv','to','vel','rot','scl','flip','follow','grow',
  'col','fill','unfill','fixed','bounce','destroy','lp','sin','cos','abs','sqrt','floor','rnd',
  't','i','mx','my','x','y','set','add','reset','score','head','tail','food',
  'when','each','size','star','w','h','vx','vy','rn','rm','if','block','scene','say','room','attach','common','def','new','oval','chase','push','map','cell','mx1','my1','mx2','my2','mx3','my3','mx4','my4','start','shape'];   // append only: codes must stay stable
const TOK2BYTE={}, BYTE2TOK={};
TOKENS.forEach((w,n)=>{ const b=128+n; TOK2BYTE[w]=b; BYTE2TOK[b]=w; });

/* bytecode: tokens 128..255 become one byte; all other text is UTF-8 bytes (0..127
   stay literal, multibyte UTF-8 uses 0xC0.. which never collide with our 128-byte

   token bytes back to words and passes the rest through a UTF-8 decode. */
const UTF8E=new TextEncoder(), UTF8D=new TextDecoder();
function toBytecode(src){
  const out=[];
  const re=/[A-Za-z_][A-Za-z0-9_]*|[^A-Za-z_]+/g; let m;
  while((m=re.exec(src))){
    const chunk=m[0];
    if(/^[A-Za-z_][A-Za-z0-9_]*$/.test(chunk) && TOK2BYTE[chunk]!==undefined){
      out.push(0xFF, TOK2BYTE[chunk]);          // 0xFF escape + token byte (unambiguous)
    } else {
      const u=UTF8E.encode(chunk);
      for(const b of u){ out.push(b===0xFF?0xFF:b, ...(b===0xFF?[0x00]:[])); } // escape literal 0xFF
    }
  }
  return new Uint8Array(out);
}
function fromBytecode(bytes){
  const lit=[]; let s='';
  const flush=()=>{ if(lit.length){ s+=UTF8D.decode(new Uint8Array(lit)); lit.length=0; } };
  for(let i=0;i<bytes.length;i++){
    if(bytes[i]===0xFF){
      const nx=bytes[i+1];
      if(nx===0x00){ lit.push(0xFF); i++; }                 // escaped literal 0xFF
      else if(BYTE2TOK[nx]!==undefined){ flush(); s+=BYTE2TOK[nx]; i++; }
      else { lit.push(0xFF); }
    } else lit.push(bytes[i]);

}

/* binary payload (v0.14+): bytes  'Q' 'Z' + raw-deflate(bytecode(stripped source)).
   No base64 (QR byte mode carries bytes directly) and no zlib header: ~35% more room.
   Returned as a Uint8Array. Older text schemes are still read by unpackSrc. */
function packBin(src){
  const clean=stripForSave(src);
  const bc=toBytecode(clean);

}

  if(bytes.length<2||bytes[0]!==0x51||bytes[1]!==0x5A) return null;

}

  const dDeflate = pako.deflate(src);

    const bc=toBytecode(src);
    if(fromBytecode(bc)===src){
      const dByte=pako.deflate(bc);
      if(dByte.length < dDeflate.length) best='QB'+toB64(dByte);

function unpackSrc(payload){
  if(payload.startsWith('QB')){ return fromBytecode(pako.inflate(fromB64(payload.slice(2)))); }
  if(payload.startsWith('QD')){ return pako.inflate(fromB64(payload.slice(2)),{to:'string'}); }
  if(payload.startsWith('Q2')){ return pako.inflate(fromB64(payload.slice(2)),{to:'string'}); } // v0.1 codes
  return payload;  // plain source
}

/* ════════════════════════════════════════════════════════════════
   7. MAP — the save is the map, the map is the game.
   Every `scene` of a program is one 6×6 tile: a 5×5 floor (320px room → 64px cells, things snapped to
   the cell their centre is in), a right-wall column and a bottom-wall row (an `exit` on a side = a gap;
   the left/top walls are the neighbours' right/bottom walls). Tiles sit next to each other the way the
   exits connect them; rooms that don't exist are rock. One colour = one word:
     black wall · white floor · blue hero · yellow coin · green slime · red door · cyan key · magenta chest
   The top edge of the frame carries the state: a red L (orientation), hp as blue modules, cyan at the far
   right = has the key. The hero is drawn in the room the hero is in.
   Reading goes the other way: a map (scanned, pictured, or painted) is rewritten into scene blocks and
   played with the def/common/frame rules in the editor. ═══════════════════════════════════════════════ */
const WC={WALL:0,HERO:1,DOOR:2,SLIME:3,FLOOR:4,COIN:5,KEY:6,CHEST:7,BOSS:8,SWORD:9,SWORD2:10,SHOP:11,NPC:12,ARMOR:13,TREASURE:14,HEALER:15};

  blank(R){ const tiles=[]; for(let y=0;y<R;y++){ tiles.push([]); for(let x=0;x<R;x++) tiles[y].push(new Uint8Array(36).fill(WC.WALL)); } return {R,tiles,hp:3,haskey:0}; },
  toGrid(W){ const R=W.R,N=R*6+2; const g=[]; for(let r=0;r<N;r++) g.push(new Uint8Array(N).fill(WC.WALL));
    g[0][0]=g[0][1]=g[1][0]=WC.DOOR;
    for(let ry=0;ry<R;ry++)for(let rx=0;rx<R;rx++){ const t=W.tiles[ry][rx]; for(let i=0;i<6;i++)for(let j=0;j<6;j++) g[1+ry*6+i][1+rx*6+j]=t[i*6+j]; }
    for(let i=0;i<R;i++) g[1+i*6+5][N-1]=g[N-1][1+i*6+5]=WC.WALL;
    for(let k=0;k<Math.min(W.hp|0,N-6);k++) g[0][3+k]=WC.HERO;
    if(W.haskey) g[0][N-2]=WC.KEY;
    if(W.sword===1) g[0][N-3]=WC.SWORD; else if(W.sword>=2) g[0][N-3]=WC.SWORD2;
    if(W.ahp>0) g[0][N-4]=WC.ARMOR; if(W.quest===1) g[0][N-5]=WC.NPC; else if(W.quest>=2) g[0][N-5]=WC.TREASURE; if(W.bow) g[0][N-6]=WC.SWORD;
    for(let k=0;k<Math.min(W.gold|0,N-7);k++) g[N-1][3+k]=WC.COIN;
    return g; },
  fromGrid(g){ const N=g.length; if(N<8||(N-2)%6) return null; const R=(N-2)/6;

    if(g[0][2]!==WC.WALL||g[1][1]===WC.DOOR||g[2][0]!==WC.WALL) bad+=3;
    for(let ry=0;ry<R;ry++)for(let rx=0;rx<R;rx++){ if(g[1+ry*6+5][1+rx*6+5]!==WC.WALL) bad+=2; if(g[1+ry*6+5][N-2]!==WC.WALL) bad++; if(g[N-2][1+rx*6+5]!==WC.WALL) bad++; }

    for(let ry=0;ry<R;ry++)for(let rx=0;rx<R;rx++){ const t=W.tiles[ry][rx]; for(let i=0;i<6;i++)for(let j=0;j<6;j++){ const v=g[1+ry*6+i][1+rx*6+j]; t[i*6+j]=v; if(v!==WC.WALL)floor++; } t[35]=WC.WALL; }

    W.ahp=g[0][N-4]===WC.ARMOR?3:0; W.quest=g[0][N-5]===WC.NPC?1:g[0][N-5]===WC.TREASURE?2:0; W.bow=g[0][N-6]===WC.SWORD?1:0; let gold=0; for(let k=3;k<N-4;k++) if(g[N-1][k]===WC.COIN) gold++; W.gold=gold;
    return W; },
  render(g,css){ const N=g.length; const c=document.createElement('canvas'); const cell=Math.max(2,Math.floor(560/N)), pad=cell*2;
    c.width=c.height=N*cell+pad*2; const gx=c.getContext('2d'); gx.fillStyle='#fff'; gx.fillRect(0,0,c.width,c.height);
    for(let r=0;r<N;r++)for(let k=0;k<N;k++){ const P=mcode.PALETTE[g[r][k]]; gx.fillStyle=`rgb(${P[0]},${P[1]},${P[2]})`; gx.fillRect(pad+k*cell,pad+r*cell,cell,cell); }

  hero(W){ for(let ry=0;ry<W.R;ry++)for(let rx=0;rx<W.R;rx++){ const t=W.tiles[ry][rx]; for(let k=0;k<36;k++) if(t[k]===WC.HERO) return {rx,ry,i:(k/6)|0,j:k%6}; } return null; },
  hasFloor(t){ for(let i=0;i<5;i++)for(let j=0;j<5;j++) if(t[i*6+j]!==WC.WALL) return true; return false; }
};
window.wmap=wmap;
const cellOf=v=>Math.max(0,Math.min(4,Math.floor((v-WT)/WCELL)));

/* ── program → map ─────────────────────────────────────────────── */
/* run a scene's init without disturbing the running game; returns its root objects by group */
function dryScene(n){
  const keep={objs,named:{...named},vars:{...vars},sceneN,lastObj,frameN,pendingScene,resetFlag,sayText,sayLeft};
  let roots=[];
  try{ doInit(n,true); roots=objs.filter(o=>o.alive&&!o.parent); }catch(e){ roots=[]; }
  objs=keep.objs; for(const k in named) delete named[k]; Object.assign(named,keep.named); vars=keep.vars; sceneN=keep.sceneN; lastObj=keep.lastObj; frameN=keep.frameN; pendingScene=keep.pendingScene; resetFlag=keep.resetFlag; sayText=keep.sayText; sayLeft=keep.sayLeft;
  return roots;

const sideOf=o=>{ const cx=o.x+o.w/2, cy=o.y+o.h/2; if(o.h>=o.w) return cx<160?'left':'right'; return cy<160?'top':'bottom'; };

/* one room's objects → one tile (+ exits for the neighbours) */
function roomTile(roots,withHero){
  const t=new Uint8Array(36).fill(WC.FLOOR); for(let k=0;k<5;k++){ t[k*6+5]=WC.WALL; t[30+k]=WC.WALL; } t[35]=WC.WALL;
  const exits=[], things=[];
  for(const o of roots){
    const g=o.group||''; const target=/^go(\d+)$/.exec(g);
    if(g==='exit'||target){ const s=sideOf(o); if(!s) continue; const cells=(s==='left'||s==='right')?cellsIn(o.y,o.y+o.h):cellsIn(o.x,o.x+o.w); exits.push({side:s,cells,to:target?+target[1]:null}); continue; }
    if(g==='wall'&&o.fixed){ if(o.x<WT||o.x+o.w>320-WT||o.y<WT||o.y+o.h>320-WT){ if(o.w<WT*2||o.h<WT*2) continue; }   // outer walls are implicit

    if(g==='door'){ const B=bounds(o); const cx=(B.l+B.r)/2, cy=(B.t+B.b)/2;
      if(cx<WT||cx>320-WT||cy<WT||cy>320-WT){ const side=cx<WT?'left':cx>320-WT?'right':cy<WT?'top':'bottom'; const cells=(side==='left'||side==='right')?cellsIn(B.t,B.b):cellsIn(B.l,B.r); exits.push({side,cells,to:null,door:true}); continue; }

/* every scene of the compiled program → a map; the current room (if `live`) from the live objects */
function progToMap(live){

  const defNames=[...codeEl.value.matchAll(/^def\s+(\w+)\s*:/gm)].map(m=>m[1]);
  let name=defNames.includes('hero')?'hero':(defNames[0]||'thing'), parts=[];
  const defRange=nm=>{ const L=codeEl.value.split('\n'); const a=L.findIndex(l=>new RegExp('^def\\s+'+nm+'\\s*:').test(l)); if(a<0) return null; let b=a+1; while(b<L.length&&(/^\s/.test(L[b])||L[b].trim()==='')){ if(L[b].trim()===''&&!(b+1<L.length&&/^\s/.test(L[b+1]))) break; b++; } return [a,b,L]; };
  const parseDef=nm=>{ const r=defRange(nm); const out=[]; if(!r) return out;
    for(const l of r[2].slice(r[0]+1,r[1])){ const pm=/^\s*(?:(\w+)\s*:\s*)?(box|circ|oval|tri)\b\s*([^:]*)(.*)$/.exec(l); if(!pm){ if(l.trim()) out.push({raw:l}); continue; }
      const nums=pm[3].split(',').map(v=>parseFloat(v)).filter(v=>!isNaN(v)); const col=/col\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)/.exec(pm[4]); const at=/attach\s+(\w+)\s*(-?[\d.]+)\s*,\s*(-?[\d.]+)/.exec(pm[4]);
      const p={name:pm[1]||'',shape:pm[2],w:nums[2]||12,h:nums[3]||nums[2]||12,fill:/\bfill\b/.test(pm[4]),col:col?[+col[1],+col[2],+col[3]]:[200,200,200],dx:at?+at[2]:0,dy:at?+at[3]:0,root:!at,extra:pm[4].replace(/:\s*(fill|col\s*[\d.,\s]+|attach\s+\w+\s*[-\d.,\s]+)\s*/g,'').trim()};
      if(p.shape==='circ'){ p.w=p.h=(nums[2]||6)*2; } out.push(p); }
    return out; };
  parts=parseDef(name); if(!parts.length) parts=[{name:'',shape:'box',w:12,h:12,fill:true,col:[70,120,220],dx:0,dy:0,root:true,extra:''}];
  const hex=c=>'#'+c.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join(''); const unhex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
  card.innerHTML=`<h2>build a character</h2>
    <div class="row"><input id="ch-name" value="${name}" style="width:110px;font-family:inherit;background:#0f1218;color:#e6e9ef;border:1px solid var(--edge);border-radius:6px;padding:6px"><select id="ch-pick" style="font-family:inherit;background:#0f1218;color:#e6e9ef;border:1px solid var(--edge);border-radius:6px;padding:6px"><option value="">edit existing…</option>${defNames.map(d=>`<option>${d}</option>`).join('')}</select><button id="ch-add">+ part</button></div>
    <div id="qrbox" style="min-height:120px"></div>
    <div id="ch-parts" style="text-align:left;font-size:12px;max-height:220px;overflow:auto"></div>
    <p style="margin:8px 0">The first row is the root; every other part hangs off it at dx, dy. Negative dy is up. Width × height; circles use width.</p>
    <div class="row"><button id="ch-ins" class="go">insert into program</button><button id="qr-close">close</button></div>`;
  ov.classList.add('open'); document.getElementById('qr-close').onclick=closeOv;
  const box=document.getElementById('qrbox'), list=document.getElementById('ch-parts'), nameEl=document.getElementById('ch-name');
  const preview=()=>{ box.innerHTML=''; const c=document.createElement('canvas'); const S=4; c.width=c.height=240; const g=c.getContext('2d'); g.fillStyle='#24222e'; g.fillRect(0,0,240,240);
    const ox=100,oy=100; parts.forEach(p=>{ if(p.raw) return; const x=ox+(p.root?0:p.dx)*S, y=oy+(p.root?0:p.dy)*S, w=p.w*S, h=p.h*S; g.fillStyle=g.strokeStyle=`rgb(${p.col.join(',')})`; g.lineWidth=2; g.beginPath();
      if(p.shape==='box') g.rect(x,y,w,h); else if(p.shape==='circ') g.ellipse(x,y,Math.abs(w/2),Math.abs(h/2),0,0,Math.PI*2); else if(p.shape==='oval') g.ellipse(x+w/2,y+h/2,Math.abs(w/2),Math.abs(h/2),0,0,Math.PI*2); else { g.moveTo(x+w/2,y); g.lineTo(x+w,y+h); g.lineTo(x,y+h); g.closePath(); }   // circ: x,y is the centre, as in the game
      if(p.fill) g.fill(); else g.stroke(); });
    c.style.width=c.style.height='180px'; c.style.imageRendering='pixelated'; box.appendChild(c); };
  const inp=(v,w,cb,type='number')=>{ const e=document.createElement('input'); e.type=type; e.value=v; e.style.cssText=`width:${w}px;font-family:inherit;font-size:12px;background:#0f1218;color:#e6e9ef;border:1px solid var(--edge);border-radius:4px;padding:3px`; e.oninput=()=>{cb(e.value);preview();}; return e; };
  const render=()=>{ list.innerHTML=''; parts.forEach((p,i)=>{ const row=document.createElement('div'); row.style.cssText='display:flex;gap:4px;align-items:center;margin:3px 0;flex-wrap:wrap';
      if(p.raw){ row.textContent=p.raw.trim()+'  (kept as is)'; row.style.color='#8a93a6'; const x=document.createElement('button'); x.textContent='×'; x.onclick=()=>{parts.splice(i,1);render();}; row.appendChild(x); list.appendChild(row); return; }
      if(!p.root) row.appendChild(inp(p.name,56,v=>p.name=v,'text')); else { const r=document.createElement('span'); r.textContent='root'; r.style.width='56px'; r.style.color='#4ad7b0'; row.appendChild(r); }
      const sh=document.createElement('select'); ['box','circ','oval','tri'].forEach(s=>{const o=document.createElement('option');o.textContent=s;o.selected=p.shape===s;sh.appendChild(o);}); sh.style.cssText='font-family:inherit;font-size:12px;background:#0f1218;color:#e6e9ef;border:1px solid var(--edge);border-radius:4px'; sh.onchange=()=>{p.shape=sh.value;preview();}; row.appendChild(sh);
      row.appendChild(inp(p.w,40,v=>p.w=+v||1)); row.appendChild(inp(p.h,40,v=>p.h=+v||1));
      const col=inp(hex(p.col),32,v=>p.col=unhex(v),'color'); col.style.padding='0'; col.style.height='24px'; row.appendChild(col);
      const f=document.createElement('input'); f.type='checkbox'; f.checked=p.fill; f.title='fill'; f.onchange=()=>{p.fill=f.checked;preview();}; row.appendChild(f);
      if(!p.root){ row.appendChild(inp(p.dx,40,v=>p.dx=+v||0)); row.appendChild(inp(p.dy,40,v=>p.dy=+v||0)); const x=document.createElement('button'); x.textContent='×'; x.onclick=()=>{parts.splice(i,1);render();preview();}; row.appendChild(x); }
      list.appendChild(row); });
    const hdr=document.createElement('div'); hdr.style.cssText='color:#8a93a6;margin-top:4px'; hdr.textContent='name · shape · w · h · colour · fill · dx · dy'; list.appendChild(hdr); preview(); };
  document.getElementById('ch-add').onclick=()=>{ parts.push({name:'part'+parts.length,shape:'box',w:6,h:6,fill:true,col:[220,200,160],dx:0,dy:-8,root:false,extra:''}); render(); };
  document.getElementById('ch-pick').onchange=e=>{ if(!e.target.value) return; name=e.target.value; nameEl.value=name; parts=parseDef(name); if(!parts.length) parts=[{name:'',shape:'box',w:12,h:12,fill:true,col:[200,200,200],dx:0,dy:0,root:true,extra:''}]; render(); };
  document.getElementById('ch-ins').onclick=()=>{ name=nameEl.value.trim()||'thing'; const dim=p=>p.shape==='circ'?`${p.w/2}`:`${p.w}, ${p.h}`;
    const lines=parts.map(p=>p.raw?p.raw:`  ${p.root?'':(p.name||'part')+': '}${p.shape} 0, 0, ${dim(p)}${p.fill?' : fill':''} : col ${p.col.join(', ')}${p.root?'':` : attach ${name} ${p.dx}, ${p.dy}`}${p.extra?' '+p.extra:''}`);
    const block=`def ${name}:\n${lines.join('\n')}`; const r=defRange(name);
    if(r){ const L=r[2]; L.splice(r[0],r[1]-r[0],block); codeEl.value=L.join('\n'); } else codeEl.value=block+'\n\n'+codeEl.value;
    closeOv(); run(); setStatus(`def ${name} written`,false); };
  render();
};

/* autorun on first load */
run();
</script>
</body>
</html>
